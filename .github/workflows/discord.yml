name: Discord notification

on:
  push:
    branches: [main]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          commits = event.get("commits", [])
          repo = event["repository"]
          sender = event["sender"]

          if not commits:
              print("No commits to notify.")
              raise SystemExit(0)

          descriptions = []
          for commit in commits[:10]:
              title = commit["message"].splitlines()[0][:150]
              author = commit["author"]["name"]
              descriptions.append(
                  f"[`{commit['id'][:7]}`]({commit['url']}) "
                  f"{title} - {author}"
              )

          count = len(commits)
          payload = json.dumps({
              "embeds": [{
                  "author": {
                      "name": sender["login"],
                      "icon_url": sender["avatar_url"],
                      "url": sender["html_url"]
                  },
                  "title": (
                      f"[{repo['name']}:main] {count} new "
                      f"{'commit' if count == 1 else 'commits'}"
                  ),
                  "url": event["compare"],
                  "description": "\n".join(descriptions)[:4096],
                  "color": 7506394
              }],
              "allowed_mentions": {"parse": []}
          }).encode("utf-8")

          request = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions"
              }
          )

          with urllib.request.urlopen(request) as response:
              print("Sent:", response.status)
          PY
