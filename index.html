.logo small{margin-left:-6px}
.intro h1,.panel-title,.hero-preview h2,.intro p,.sub,.help{word-break:keep-all}
/* Figma Nucleus UI Lite 기준: 칼선 그림자 대신 흰 카드와 옅은 회색 선, 48px 알약 버튼 */
.panel,.saved-card,.feature-strip{background:#ffffff;border:1px solid #ebe8df;border-radius:24px;box-shadow:0 1px 2px rgba(54,49,45,.05)}
.empty{background:#ffffff;border:1px dashed #d9d6cb;border-radius:24px;box-shadow:none}
input[type=text],select,textarea{min-height:48px;border:1px solid #e3e5e5;border-radius:8px;background:#ffffff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(66,59,53,.14)}
.choice{border:1px solid #e3e5e5;border-radius:999px;background:#ffffff;box-shadow:none}.choice.with-icon{border-radius:var(--radius-container)}
/* Coffee Shop 카테고리 칩처럼 고른 것만 채운다. 아이콘 칩은 그림이 묻히지 않게 연한 색으로 */
.choice.selected{border-color:var(--brand);background:var(--brand);color:#ffffff;box-shadow:none}.choice.with-icon.selected{background:#eeeae7;color:var(--ink)}
.primary{min-height:48px;border:0;border-radius:999px;box-shadow:none;transition:background .15s}
.primary:active:not(:disabled){transform:none;box-shadow:none;background:#352f29}
.secondary{min-height:48px;border:0;border-radius:999px;background:#eeeae7;color:var(--brand);box-shadow:none}
.secondary:active:not(:disabled){transform:none;box-shadow:none;background:#e2ddd9}
/* 알약 버튼은 줄바꿈되면 덩어리처럼 보여서, 이전 버튼은 글자만큼만 쓰고 나머지를 주 버튼에 준다 */
.actions>.secondary[data-step]{flex:0 0 auto}.actions>.primary{flex:1;white-space:nowrap}
/* Nucleus Controls/Buttons, Text Fields 실측값: 높이 48, 글자 16 Medium, 입력칸 안쪽 여백 16, 보조 글자 var(--color-text-gray) */
.primary,.secondary{height:48px;padding:0 24px;font-size:16px;font-weight:500}
input[type=text],select,textarea{padding:12px 16px;font-size:16px;line-height:24px;color:#090a0a}
textarea{height:auto}
input::placeholder,textarea::placeholder{color:var(--color-text-gray)}
.field>label,.field>legend{font-size:14px;font-weight:500;color:#303437;margin-bottom:8px}
.help,.sub,.note,.form-foot{color:var(--color-text-gray)}.help{font-size:12px;line-height:16px;margin-top:8px}
.text-button{color:var(--brand);font-weight:500;text-decoration:none}
.choice{min-height:40px;padding:8px 16px;font-size:14px;color:#303437}.choice.with-icon{min-height:72px}
.panel{padding:24px}.field{margin-bottom:24px}
.notice{background:#fff4ec;border:0;border-radius:var(--radius-element);padding:12px 14px;color:#6f5a49}
.concept{background:#f7f5ef;border:0;border-radius:var(--radius-container)}
.palette-card{border:1px solid #e3e5e5;border-radius:var(--radius-container);box-shadow:none}.palette-card.selected{border:2px solid var(--brand);box-shadow:none}
.preview-stage{border:0;background:#f3f1ea;border-radius:20px}
.preview-stage .big-sticker,#live-sticker{transform:none;filter:drop-shadow(0 10px 14px rgba(54,49,45,.14))}
/* PC도 휴대폰처럼 한 줄 화면이라, 캐릭터 미리보기를 입력보다 먼저 보여준다 */
.layout>aside.panel:has(.preview-stage){order:-1;padding:14px}.layout>aside.panel:has(.preview-stage) :is(.note,.preview-caption,.download-info){display:none}.preview-stage{min-height:0;padding:12px}.preview-stage .big-sticker,#live-sticker{max-width:220px;margin:6px auto}
.start{min-height:100vh;display:grid;place-items:center;padding:24px 16px}.start .panel{width:100%;max-width:420px}.start .logo{margin-bottom:22px}.start h1{font-size:27px;line-height:1.35;letter-spacing:-1px;margin:0 0 8px;word-break:keep-all}.start h1 em{font-style:normal;color:#e47751}.shop-chip{font-size:12px;color:#65615d}
.start .panel{padding:0;overflow:hidden}.start-hero{height:220px;background:var(--brand);display:grid;place-items:end center;overflow:hidden}.start-hero img{width:210px;margin-bottom:-28px}.start-body{padding:24px}

/* 디자인 A 크리에이티브 스튜디오: 코랄은 다음으로 넘어가는 버튼, 보라는 AI 생성에만. 화면 글꼴은 Pretendard, Jua는 가게 이름에만 */
.intro h1,.panel-title,.hero-preview h2,.market-big,.guide-grid h3,.empty h2,.download-info strong{font-family:'Pretendard Variable',Pretendard,sans-serif;font-weight:700;letter-spacing:-.4px}
.intro h1{font-size:24px;line-height:1.35;margin:0 0 6px}.intro h1 em{color:inherit}.intro{margin-bottom:18px}.panel-title{font-size:19px}
.ai{background:var(--ai)!important;color:#fff}.ai:active:not(:disabled){background:#5a3fe0!important}
.ai-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ai);background:var(--color-background-purple);border-radius:999px;padding:4px 10px}
.choice.selected{background:var(--brand);border-color:var(--brand)}.choice.with-icon.selected{background:var(--color-accent-muted);color:var(--ink)}
.palette-card.selected{border-color:var(--brand)}
/* 단계 이름을 항상 보여서 입력 → AI → 편집 → 완성 흐름이 읽히게 */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 20px}.step-line{display:none}
.step{flex-direction:column;gap:6px;font-size:12px;color:#9a918b;position:relative}.steps .step .step-label{position:static;width:auto;height:auto;clip:auto;overflow:visible}
.step:before{content:'';display:block;width:100%;height:4px;border-radius:4px;background:#ece6dc}.step.done:before,.step.active:before{background:var(--brand)}
.step b{display:none}.step.active{color:var(--ink);font-weight:700}.step.done{color:var(--ink)}
/* 시작 화면: 업종이 다른 예시 브랜드 결과물을 먼저 보여준다 */
.start-hero{height:auto;background:#f3ede6;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px 20px 16px;scrollbar-width:none}
.start-hero::-webkit-scrollbar{display:none}
.start-hero figure{flex:0 0 62%;margin:0;scroll-snap-align:center;background:#fff;border-radius:var(--radius-container);overflow:hidden}
.start-hero img{display:block;width:100%;aspect-ratio:1;margin:0}.start-hero figcaption{padding:10px 14px;font-size:13px;color:#5f5650}.start-hero figcaption b{font-family:'Jua',sans-serif;font-weight:400;font-size:16px;color:var(--ink);margin-right:6px}
.start h1{font-size:24px;letter-spacing:-.6px}
.flow{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0 0 20px}.flow li{font-size:12px;color:#5f5650;background:#f3ede6;border-radius:999px;padding:5px 10px}.flow li.ai-step{color:var(--ai);background:var(--color-background-purple)}
/* 편집 단계 미리보기는 스티커만이 아니라 쇼핑백에 붙은 모습으로 */
.preview-stage .mockup-scene{margin:0;height:300px;background:linear-gradient(145deg,#f3ede6,#e8ddd0)}.preview-stage .bag{transform:rotate(-6deg) scale(.85);margin-top:30px}.preview-stage .bag img#live-sticker{max-width:134px;margin:0;transform:rotate(6deg)}
.market-fold{margin:16px 0}.market-fold summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--ink);padding:10px 0}
/* 완성 화면: 받을 수 있는 결과물 세 가지를 카드로 */
.deliverables{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.deliverables figure{margin:0;background:var(--color-background-body);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.deliverables img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px}
.deliverables figcaption{font-size:12px;color:#5f5650;margin:6px 0}
.deliverables button{width:100%;height:36px;padding:0;font-size:13px;border-radius:999px}

/* 내 브랜드 카드: 업종·날짜를 한 줄씩 고정하고 버튼은 카드 바닥에 붙여 줄을 맞춘다 */
.saved-card{display:flex;flex-direction:column}.saved-body{flex:1;display:flex;flex-direction:column}

.saved-body .actions{margin-top:auto;gap:8px}.saved-body .actions button{height:40px;font-size:14px;padding:0 12px}
/* 홈·마이페이지 (체험용 목업) */
.home-new{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--brand);color:#fff;border:0;border-radius:20px;padding:20px;margin-bottom:12px}
.home-new .icon{width:28px;height:28px;flex:none}.home-new strong{display:block;font-size:17px}.home-new small{opacity:.85;font-size:13px}
.home-resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--radius-container);padding:12px;margin-bottom:12px}

.usage{background:#fff;border:1px solid var(--line);border-radius:var(--radius-container);padding:14px 16px;margin-bottom:24px}.usage-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}.usage-row b{color:var(--ai)}

.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}.section-head h2{font-size:16px;margin:0}
.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.recent button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-size:12px;color:#5f5650}
.recent img{display:block;width:100%;aspect-ratio:1;margin-bottom:6px}
.my-list{background:#fff;border:1px solid var(--line);border-radius:var(--radius-container);overflow:hidden;margin-bottom:16px}
.my-list>*{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;font-size:15px;color:var(--ink);text-align:left}

.gen-steps li{padding:3px 0}.gen-steps li:before{content:'○ '}.gen-steps li.active{color:var(--ai);font-weight:600}.gen-steps li.active:before{content:'● '}.gen-steps li.done{color:#5f5650}.gen-steps li.done:before{content:'✓ '}
.preview-stage.is-loading img{opacity:.25;filter:blur(3px);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.5}}@media (prefers-reduced-motion:reduce){.preview-stage.is-loading img{animation:none}}

/* 로그인·회원가입 (체험용: 계정은 이 브라우저에만 저장) */
input[type=password]{width:100%;min-height:48px;border:1px solid #e3e5e5;border-radius:8px;background:#fff;padding:12px 16px;font-size:16px;line-height:24px;color:#090a0a;outline:none}
input[type=password]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(184,71,50,.14)}
.auth-links{display:flex;justify-content:center;gap:16px;margin:16px 0 0;font-size:14px}
.auth-links .text-button{font-size:14px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:#303437;cursor:pointer;margin:0 0 6px}.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--brand);flex:none}
.code-box{font:700 22px/1.4 ui-monospace,Consolas,monospace;letter-spacing:1px;text-align:center;background:var(--color-background-body);border:1px dashed #d9cfc4;border-radius:var(--radius-element);padding:16px 8px;margin:16px 0 10px;word-break:break-all;user-select:all}
.code-actions{display:flex;gap:8px;margin-bottom:16px}.code-actions button{flex:1}
.warn{background:#fff4ec;border-radius:var(--radius-element);padding:12px 14px;font-size:13px;color:#6f5a49;margin:0 0 16px}
.my-list>details{display:block;padding:0}.my-list summary{padding:14px 16px;cursor:pointer;font-size:15px;list-style:none;display:flex;justify-content:space-between}.my-list summary::-webkit-details-marker{display:none}.my-list summary:after{content:'›';color:var(--color-text-gray)}
.my-list details form{padding:0 16px 16px}.my-list details .field{margin-bottom:12px}

/* AI 브랜드 분석 카드, 스티커 세트, SNS 홍보물 */
.analysis{background:#fff;border:1px solid var(--line);border-radius:var(--radius-container);padding:16px;margin:0 0 20px}
.analysis-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:15px}
.slogan{margin:0 0 14px;font-size:18px;font-weight:700;line-height:1.4;color:var(--ink);background:var(--color-background-body);border-radius:var(--radius-element);padding:12px 14px;word-break:keep-all}

.rec-colors{display:flex;gap:8px;margin-bottom:14px}.rec-colors i{width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.analysis .tags{display:flex;flex-wrap:wrap;gap:6px}.analysis .tags span{font-size:13px;background:var(--color-background-body);border-radius:999px;padding:4px 10px;color:#5f5650}
.analysis-actions{display:flex;gap:16px;margin-top:12px}.analysis-loading{font-size:13px;color:var(--ai);margin:0 0 10px}
.sec-title{font-size:16px;margin:0 0 10px}
.post-preview{display:block;width:100%;max-width:300px;margin:10px auto 0;border-radius:var(--radius-element);border:1px solid var(--line)}
.deliverables.set{grid-template-columns:repeat(2,1fr)}
.insta{border:1px solid var(--line);border-radius:var(--radius-container);background:#fff;overflow:hidden;margin-top:16px}
.insta-head{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:14px;font-weight:600}.insta-av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--color-background-body);flex:none}.insta-av img{width:100%;display:block}
.insta>img{display:block;width:100%}.insta-foot{padding:10px 12px;font-size:13px;color:#303437;line-height:1.5}.insta-foot .icon{width:22px;height:22px;display:block;margin-bottom:6px}
.insta-foot span{color:#6b4eff}

/* 인쇄 견적, 채팅 (print.js, chat.js) */
.bell{position:relative;border:0;background:none;padding:6px;color:var(--ink)}.bell .icon{width:22px;height:22px}.bell i{position:absolute;top:0;right:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);color:#fff;font:600 10px/16px sans-serif;text-align:center;padding:0 4px;font-style:normal}
.st{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}.st-open{color:#2f7d5b;background:#e8f4ee}.st-acc{color:#b84732;background:var(--color-accent-muted)}.st-prog{color:#2b6cb0;background:#e8f0fa}.st-done{color:#5f5650;background:#f1eeea}
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.req-card,.row-card,.chat-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--radius-container);padding:16px;color:var(--ink)}
.req-card>div{display:flex;flex-direction:column;gap:4px;min-width:0}.req-card .st,.quote-card header .st{align-self:flex-start}.req-card strong{font-size:16px}.req-card small{color:var(--color-text-gray);font-size:12px}.req-card b{flex:none;font-size:14px}
.row-card span{font-size:14px}.row-card small{color:var(--color-text-gray);font-size:12px;flex:none}.row-card.unread{border-color:var(--brand);background:#fffaf8}
.empty-card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-container);padding:18px;margin-bottom:16px;flex-wrap:wrap}.empty-card .icon{width:36px;height:36px;color:var(--brand)}.empty-card div{flex:1;min-width:160px}.empty-card strong{display:block;font-size:16px}.empty-card small{color:var(--color-text-gray);font-size:13px}
.sk{background:linear-gradient(90deg,#eeeae4 25%,#f7f4ef 50%,#eeeae4 75%);background-size:200% 100%;animation:sk 1.2s infinite}.sk-card{height:88px;border-radius:var(--radius-container);margin-bottom:10px}@keyframes sk{to{background-position:-200% 0}}@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.req-head{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-container);padding:14px;margin:8px 0 16px}.req-head img{width:96px;height:96px;object-fit:contain;border-radius:var(--radius-element);background:var(--color-background-body);flex:none}.req-head h1{font-size:18px;margin:6px 0 4px}.req-head p{margin:0 0 4px;font-size:13px;color:#303437}.req-head small{font-size:12px;color:var(--color-text-gray)}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;padding:0;margin:0 0 12px;font-size:12px;color:#9a918b;text-align:center}.progress li:before{content:'';display:block;height:4px;border-radius:4px;background:#ece6dc;margin-bottom:6px}.progress li.done{color:var(--ink);font-weight:600}.progress li.done:before{background:var(--brand)}
.seg{display:flex;background:#f1eeea;border-radius:999px;padding:3px}.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:#5f5650}.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.quote-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-container);padding:16px;margin-bottom:12px}.quote-card.picked{border:2px solid var(--brand)}.quote-card header{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.quote-card header strong{display:block;font-size:16px}.quote-card header small{font-size:12px;color:var(--color-text-gray)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.nums small{display:block;font-size:11px;color:var(--color-text-gray)}.nums b{font-size:15px}
.price-row{font-size:13px;color:#5f5650;margin:0 0 8px}.quote-note{font-size:13px;background:var(--color-background-body);border-radius:var(--radius-inner);padding:10px 12px;margin:0 0 12px;white-space:pre-wrap}
.danger-text{color:#c9512f!important;display:block;margin:12px auto}.primary.danger{background:#c9512f}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2>*{min-width:0}input[type=date]{min-width:0;padding:12px 8px;font-size:15px}
/* 실제 모드는 하단 메뉴가 5칸이라 칸 최소 폭을 풀어 360px에서도 들어가게 */
.bottomnav button{min-width:0;flex:1;padding:3px 4px}.choices.wrap{flex-wrap:wrap;display:flex;gap:8px}
input[type=number],input[type=date]{width:100%;min-height:48px;border:1px solid #e3e5e5;border-radius:8px;background:#fff;padding:12px 16px;font-size:16px;color:#090a0a;outline:none}input[type=number]:focus,input[type=date]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(184,71,50,.14)}
.design-pick{display:flex;gap:14px;align-items:center}.design-pick img{width:96px;height:96px;object-fit:contain;border-radius:var(--radius-element);background:var(--color-background-body);border:1px solid var(--line);flex:none}.file-btn{display:inline-flex;cursor:pointer;height:40px;font-size:14px;padding:0 14px;margin-bottom:4px}.design-pick small{display:block}

// 복구 코드: 헷갈리는 0/O, 1/I/L을 뺀 31자 중 16자. 248 이상은 버려서 글자마다 확률을 같게 한다

 if(auth==='reset')return `<h1>비밀번호 재설정</h1><p class="sub">가입할 때 받은 복구 코드로 새 비밀번호를 정해요.</p><form id="reset-form" novalidate>${fld('rs-id','아이디','text','data-rule="id" maxlength="20" autocomplete="username" autocapitalize="off"')}${fld('rs-code','복구 코드','text','data-rule="code" maxlength="19" autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX"')}${fld('rs-pw','새 비밀번호','password','data-rule="pw" maxlength="64" autocomplete="new-password"')}${fld('rs-pw2','새 비밀번호 확인','password','data-rule="pw" data-same="rs-pw" maxlength="64" autocomplete="new-password"')}<p class="field-error" id="rs-form-err" role="alert" hidden></p><button class="primary full" type="submit">비밀번호 바꾸기</button></form><div class="auth-links"><button type="button" class="text-button" data-auth="login">로그인으로 돌아가기</button></div>`;
 return `<h1>우리 가게만의 캐릭터를 만들어보세요</h1><p class="sub">디자인 경험이 없어도 괜찮아요. 로그인하고 AI와 함께 시작해요.</p><ol class="flow" aria-label="만드는 순서"><li>가게 정보 입력</li><li class="ai-step">AI 브랜드 분석</li><li>캐릭터·홍보물</li><li>다운로드</li></ol><form id="login-form" novalidate>${fld('li-id','아이디','text',`maxlength="20" autocomplete="username" autocapitalize="off" value="${DEMO.id}"`)}${fld('li-pw','비밀번호','password',`maxlength="64" autocomplete="current-password" value="${DEMO.pw}"`)}<p class="help" style="margin:-12px 0 16px">체험 계정(${DEMO.id} / ${DEMO.pw})이 채워져 있어요. 로그인만 누르면 돼요.</p><p class="field-error" id="li-form-err" role="alert" hidden></p><button class="primary full" type="submit">로그인 ${icon('arrow')}</button></form><div class="auth-links"><button type="button" class="text-button" data-auth="signup">회원가입</button><button type="button" class="text-button" data-auth="reset">비밀번호를 잊었어요</button></div>`}
function codePage(){return `<main class="start"><section class="panel"><div class="start-body"><div class="logo"><span class="logo-mark">${icon('shop')}</span>가게온<small>·</small></div><h1>복구 코드를 저장해주세요</h1><p class="sub">비밀번호를 잊었을 때 이 코드로 새 비밀번호를 정해요. 이 화면을 나가면 다시 볼 수 없어요.</p><div class="code-box" id="code-text">${esc(pendingCode)}</div><div class="code-actions"><button type="button" class="secondary" id="copy-code">복사하기</button><button type="button" class="secondary" id="save-code">파일로 저장</button></div><p class="warn">비밀번호와 복구 코드를 둘 다 잃으면 계정을 되찾을 수 없어요. 새 코드를 받으면 이전 코드는 쓸 수 없어요.</p><label class="check"><input type="checkbox" id="code-ok">복구 코드를 안전한 곳에 저장했어요.</label><button class="primary full" id="code-done" disabled style="margin-top:12px">계속하기</button></div></section></main>`}
function startPage(){return `<main class="start"><section class="panel"><div class="start-hero" aria-label="가게온으로 만든 예시 브랜드">${samples().reverse().map(b=>`<figure><img src="${svgUri(packSVG({...b,mockup:'bag'}))}" alt="${esc(b.name)} 스티커를 붙인 쇼핑백"><figcaption><b>${esc(b.name)}</b>${esc(b.industry)}</figcaption></figure>`).join('')}</div><div class="start-body"><div class="logo"><span class="logo-mark">${icon('shop')}</span>가게온<small>·</small></div>${REAL?realAuthForm():authForm()}<p class="form-foot">${icon('info')}${REAL?'계정과 견적, 채팅은 가게온 서버에 저장돼요.':'체험 버전이라 계정은 이 브라우저에만 저장돼요.'}</p></div></section></main>`}
function render(){
if(REAL&&myRole==='admin'&&page!=='admin'&&page!=='start')page='admin';
// 단계와 화면을 브라우저 기록에 남겨 휴대폰 뒤로가기로 이전 화면에 가게 한다
if(!history.state||history.state.page!==page||history.state.step!==step)history[history.state?'pushState':'replaceState']({page,step},'');saveDraft();
if(page==='code'&&!pendingCode)page=user?'home':'start';
if(page==='start'||page==='code'){$('#app').innerHTML=page==='code'?codePage():startPage();bind();return}
$('#app').innerHTML=`<aside class="sidebar">${logo()}<div class="caption">YOUR LITTLE BRAND STUDIO</div>${nav('nav')}<div class="side-note">${icon('leaf')}<strong>작은 가게, 빛나는 브랜드</strong>사장님의 이야기에<br>우리 가게다운 모습을 더해요.</div></aside><main class="main${REAL&&APP_TITLE_PAGES.includes(page)?' app-page':''}">${REAL?appBar():`<header class="topbar"><div class="mobile-logo">${logo()}</div><div class="breadcrumb">GAGEON STUDIO <span>/ ${PAGE_LABEL[page]||({home:'홈',studio:'브랜드 만들기',saved:'내 브랜드',mypage:'마이페이지'})[page]||'이용 가이드'}</span></div><button class="text-button shop-chip" id="logout">${esc(shop)} 사장님 · 나가기</button></header>`}${PAGES[page]?PAGES[page]():page==='studio'?studio():page==='saved'?saved():page==='home'?home():page==='mypage'?mypage():guide()}<footer class="mini-foot"><span>가게온 · 작은 가게의 시작을 응원합니다.</span><span>BRAND YOUR OWN STORY</span></footer></main>${nav('bottomnav')}`;
bind();
}
function home(){const d=draft(),rs=records().slice(0,3),left=Math.max(0,MOCK_LIMIT-used());return `<section class="intro"><h1>${esc(shop)} 사장님, 안녕하세요</h1><p>오늘은 어떤 브랜드를 만들어볼까요?</p></section>
<button class="home-new" id="new-brand">${icon('spark')}<span><strong>새 브랜드 만들기</strong><small>가게 정보 → AI 브랜드 분석 → 캐릭터·홍보물 → 다운로드</small></span></button>
${d&&d.state&&d.state.name?`<button class="home-resume" id="resume-draft"><img src="${svgUri(stickerSVG({...initial(),...d.state}))}" alt=""><span><strong>${esc(d.state.name)} 이어서 만들기</strong><small>${['가게 정보 입력','AI 브랜드 분석','캐릭터·홍보물','다운로드'][(d.step||1)-1]} 단계에서 멈췄어요</small></span></button>`:''}
<div class="usage"><div class="usage-row"><span>체험 AI 생성</span><span><b>${left}</b> / ${MOCK_LIMIT}회 남음</span></div><div class="usage-bar"><i style="width:${left/MOCK_LIMIT*100}%"></i></div></div>
<div class="section-head"><h2>최근 작업</h2><button class="text-button" data-page="saved">전체 보기</button></div>
${rs.length?`<div class="recent">${rs.map(r=>`<button data-open="${esc(r.id)}"><img src="${svgUri(stickerSVG(r))}" alt="">${esc(r.name)}</button>`).join('')}</div>`:'<div class="empty"><p>아직 저장한 브랜드가 없어요. 첫 브랜드를 만들어보세요.</p></div>'}`}
function mypage(){const n=records().length;return `<section class="intro"><h1>마이페이지</h1><p>체험 버전이라 계정과 정보는 이 브라우저에만 저장돼요.</p></section>
<div class="my-list"><div>아이디<small>${esc(user)}</small></div></div>
<div class="my-list"><form class="my-name" id="name-form"><input id="my-shop" type="text" maxlength="24" value="${esc(shop)}" aria-label="가게 이름"><button class="secondary" type="submit">이름 변경</button></form></div>
<div class="my-list"><div>저장한 브랜드<small>${n} / 12개</small></div><div>체험 AI 생성<small>${used()} / ${MOCK_LIMIT}회 사용</small></div><button data-page="guide">이용 가이드<small>›</small></button></div>
<div class="my-list"><details><summary>비밀번호 변경</summary><form id="pw-form" novalidate>${fld('pw-cur','현재 비밀번호','password','maxlength="64" autocomplete="current-password"')}${fld('pw-new','새 비밀번호','password','data-rule="pw" maxlength="64" autocomplete="new-password"')}${fld('pw-new2','새 비밀번호 확인','password','data-rule="pw" data-same="pw-new" maxlength="64" autocomplete="new-password"')}<button class="primary full" type="submit">변경하기</button></form></details><details><summary>복구 코드 다시 받기</summary><form id="rc-form" novalidate><p class="help" style="margin:0 0 12px">새 코드를 받으면 지금 코드는 쓸 수 없어요.</p>${fld('rc-cur','현재 비밀번호','password','maxlength="64" autocomplete="current-password"')}<button class="primary full" type="submit">새 복구 코드 받기</button></form></details></div>
<div class="my-list"><button id="logout-my">로그아웃<small>›</small></button><details><summary class="danger">회원 탈퇴</summary><form id="leave-form" novalidate><p class="help" style="margin:0 0 12px">계정이 지워지고 되돌릴 수 없어요. 저장한 브랜드는 이 브라우저에 남아요.</p>${fld('lv-cur','현재 비밀번호','password','maxlength="64" autocomplete="current-password"')}<button class="primary full" type="submit">탈퇴하기</button></form></details><button class="danger" id="wipe">이 브라우저의 가게온 데이터 모두 지우기</button></div>`}
function steps(){return `<div class="steps" aria-label="진행 단계">${['가게 정보 입력','AI 브랜드 분석','캐릭터·홍보물','다운로드'].map((v,i)=>`${i?'<span class="step-line"></span>':''}<div class="step ${step===i+1?'active':step>i+1?'done':''}" ${step===i+1?'aria-current="step"':''}><b>${step>i+1?'✓':i+1}</b><span class="step-label">${v}</span></div>`).join('')}</div>`}
function studio(){const titles=['가게 정보를 알려주세요','AI가 브랜드를 분석했어요','캐릭터와 홍보물을 다듬어요','다운로드하고 바로 쓰세요'];const subs=['몇 가지만 알려주시면 AI가 브랜드 방향을 제안해요.','슬로건, 추천 컬러, 키워드를 확인하고 캐릭터를 만들어요.','스티커 문구와 SNS 홍보물을 바꾸면 바로 반영돼요.','스티커 세트, SNS 홍보물, 포장 이미지를 받아 가세요.'];return `<section class="intro"><p class="eyebrow">MAKE YOUR BRAND BLOOM</p><h1>${titles[step-1]}</h1><p>${subs[step-1]}</p></section>${steps()}${step===1?formPage():step===2?conceptPage():step===3?editorPage():resultPage()}`}
function choice(field,values,withIcon=false){return `<div class="choices">${values.map((v,i)=>`<button type="button" class="choice${withIcon?' with-icon':''} ${state[field]===v?'selected':''}" data-field="${field}" data-value="${esc(v)}" aria-pressed="${state[field]===v}">${withIcon?icon(['smile','leaf','spark'][i]):''}${v}</button>`).join('')}</div>`}
function formPage(){return `<div class="layout"><section class="panel"><div class="panel-title">어떤 가게를 운영하시나요?<button type="button" class="text-button" id="fill-example">예시 입력</button></div><p class="sub">가게의 개성이 드러날수록 더 잘 어울리는 브랜드가 돼요.</p><form id="brand-form" novalidate><div class="field"><label for="store-name">가게 이름<span class="required">*</span></label><input id="store-name" name="name" type="text" maxlength="24" aria-required="true" aria-describedby="name-error" placeholder="예: 한우랑" autocomplete="organization" value="${esc(state.name)}"><p class="field-error" id="name-error" role="alert" hidden>가게 이름을 적어주세요.</p></div><div class="field"><label for="industry">가게 업종<span class="required">*</span></label><input id="industry" name="industry" type="text" maxlength="100" aria-required="true" aria-describedby="industry-error" placeholder="예: 꽃집, 반려동물 용품점, 캠핑용 한우 전문점" value="${esc(state.industry)}"><p class="field-error" id="industry-error" role="alert" hidden>어떤 가게인지 적어주세요.</p><p class="help">업종을 자유롭게 적어주세요. AI 연결 후 업종과 가게 특징을 함께 해석해 브랜드를 제안해요.</p></div><div class="field"><label for="dong">가게 위치 <small>경산시 · 선택</small></label><select id="dong">${dongOptions()}</select><p class="help">동네를 고르면 주변에 같은 업종 가게가 몇 곳인지 알려드려요.</p></div><fieldset class="field"><legend>원하는 브랜드 분위기</legend>${choice('mood',['귀엽고 친근한','고급스럽고 차분한','재미있고 개성 있는'],true)}</fieldset><fieldset class="field"><legend>주요 고객층</legend>${choice('audience',['가족','청년','전 연령'])}</fieldset><div class="field"><label for="feature">우리 가게만의 특징 <small>선택</small><span class="counter" id="feature-count">${state.feature.length}/120</span></label><textarea id="feature" name="feature" maxlength="120" placeholder="주력 메뉴나 특별한 서비스를 들려주세요.">${esc(state.feature)}</textarea><p class="help"><strong>예: 캠핑용 한우 포장 세트가 주력</strong><br>대표 상품, 가게의 이야기, 특별한 장점도 좋아요.</p></div><button class="primary full" type="submit">AI 브랜드 분석하기 ${icon('arrow')}</button><p class="form-foot">${icon('info')}예시 캐릭터로 체험할 수 있어요.</p></form></section><aside class 20rx%3D%2212%22%20ry%3D%228%22%20fill%3D%22%23EF9C85%22%2F%3E%3Cellipse%20cx%3D%22208%22%20cy%3D%22190%22%20rx%3D%2212%22%20ry%3D%228%22%20fill%3D%22%23EF9C85%22%2F%3E%3Cpath%20d%3D%22m252%2062%207-15m8%2026%2015-5M57%20217l-8%2014m-6-30-15%202%22%20stroke%3D%22%23F3AB53%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E%0A" alt=""><div><strong>한우랑</strong><small>마음을 담은 한 끼</small></div></div><p class="hero-bottom">캐릭터부터 스티커까지, 같은 분위기로</p></div><div class="feature-strip"><div>${icon('smile')}<strong>우리 가게 캐릭터</strong>개성을 담은 얼굴</div><div>${icon('image')}<strong>브랜드 스티커</strong>바로 쓰는 디자인</div><div>${icon('box')}<strong>포장 미리보기</strong>붙여보고 결정</div></div><div class="note">${icon('info')}현재는 준비된 예시 캐릭터를 사용하는 체험 버전이에요. 직접 만든 캐릭터 이미지도 올릴 수 있어요.</div></aside></div>`}
function conceptPage(){const t=themes[state.theme];return `<div class="layout"><section class="panel"><div class="panel-title">${esc(state.name)} 브랜드 분석 <span class="ai-badge">${icon('spark')}AI</span></div><p class="sub">가게 정보를 바탕으로 브랜드 방향을 정리했어요.</p>${analysisCard()}<h3 class="sec-title">캐릭터</h3><div class="notice">${state.generated?(aiReady?'AI가 생성한 캐릭터예요. 같은 원본을 스티커에 재사용해요.':'목업 시연용 결과예요. 실제 서비스에서는 AI가 새로 그린 캐릭터가 들어가요.'):state.customImage?'직접 올린 이미지로 제작 중이에요.':(aiReady?'현재는 예시 캐릭터예요. 아래 버튼으로 AI 생성을 요청할 수 있어요.':'현재는 예시 캐릭터예요. 직접 만든 캐릭터 이미지를 올려 쓸 수도 있어요.')}</div>${aiReady?`<button class="primary ai full" id="generate-ai">${icon('spark')}AI로 새 캐릭터 만들기</button><p class="help">업종과 가게 특징을 반영해 새 캐릭터를 그려요. 1~2분 정도 걸려요.</p>`:`<button class="primary ai full" id="generate-ai">${icon('spark')}AI로 새 캐릭터 만들기</button><p class="help">시연용 목업이에요. 실제 AI 대신 업종에 맞춰 준비해 둔 캐릭터로 결과를 보여드려요. 체험 생성 ${Math.max(0,MOCK_LIMIT-used())}/${MOCK_LIMIT}회 남음</p>`}<div id="generation-status" role="status" aria-live="polite"></div><details class="market-fold"><summary>우리 동네 같은 업종 가게 보기</summary>${marketCard()}</details><div class="field"><label>브랜드 색상 선택</label><div class="palette-cards">${themes.map((t,i)=>`<button class="palette-card ${i===state.theme?'selected':''}" data-theme="${i}" aria-pressed="${i===state.theme}"><img src="${mascotUri()}" alt="${t.name} 캐릭터 예시" style="background:${t.bg};border-radius:10px"><strong>${t.name}</strong><span class="swatches"><i style="background:${t.bg}"></i><i style="background:${t.accent}"></i><i style="background:${t.ink}"></i></span></button>`).join('')}</div></div><label class="upload-label" for="upload">내 캐릭터로 만들고 싶다면?<input type="file" id="upload" accept="image/png,image/jpeg,image/webp"><span>PNG·JPG·WebP, 2MB 이하 · 투명 PNG 권장</span></label>${state.customImage?'<button class="text-button" id="reset-image">예시 캐릭터로 돌아가기</button>':''}<div class="actions"><button class="secondary" data-step="1">${icon('back')}이전</button><button class="primary" data-step="3">이 브랜드로 만들기 ${icon('arrow')}</button></div></section><aside class="panel"><p class="eyebrow">YOUR BRAND PREVIEW</p><div class="preview-stage"><img class="big-sticker" src="${svgUri(stickerSVG())}" alt="${esc(state.name)} 브랜드 미리보기"></div><p class="preview-caption">선택한 캐릭터와 색상은 다음 단계에도 유지돼요.</p><div class="note">${icon('save')}완성한 브랜드를 저장하면 다음에도 같은 캐릭터로 만들 수 있어요.</div></aside></div>`}
function editorPage(){return `<div class="layout"><section class="panel"><div class="panel-title">스티커를 내 마음에 쏙 맞게</div><p class="sub">글자를 수정해도 캐릭터는 그대로 유지돼요.</p><div class="field"><label for="edit-name">상호명</label><input type="text" id="edit-name" maxlength="24" value="${esc(state.name)}"></div><div class="field"><label for="message">스티커 문구</label><input type="text" id="message" maxlength="40" value="${esc(state.message)}"><p class="help">예: 맛있게 드세요! · 오늘도 감사합니다.</p></div><div class="field"><label>스티커 모양</label><div class="choices">${[['circle','원형'],['square','둥근 사각형']].map(([v,l])=>`<button class="choice ${state.shape===v?'selected':''}" data-field="shape" data-value="${v}" aria-pressed="${state.shape===v}">${l}</button>`).join('')}</div></div><div class="field"><label>브랜드 색상</label><div class="color-options">${themes.map((t,i)=>`<button class="color-dot ${state.theme===i?'selected':''}" data-theme="${i}" style="background:${t.accent}" aria-label="${t.name}" aria-pressed="${state.theme===i}"></button>`).join('')}</div></div><div class="field"><label for="font-size">상호명 크기</label><div class="range-row"><input id="font-size" type="range" min="36" max="80" value="${state.fontSize}"><output id="font-value">${state.fontSize}</output></div><p class="help">긴 상호명은 스티커 안에 맞게 자동으로 줄어들어요.</p></div><div class="field"><label>SNS 홍보물</label>${choice('postTpl',['신메뉴','이벤트','할인'])}<input type="text" id="post-text" maxlength="24" style="margin-top:10px" aria-label="홍보물 제목" placeholder="${esc(postHead({...state,postText:''}))}" value="${esc(state.postText)}"><p class="help">비워 두면 템플릿 기본 문구가 들어가요. 아래 문구는 브랜드 슬로건이에요.</p><img id="live-post" class="post-preview" src="${svgUri(postSVG())}" alt="SNS 홍보물 미리보기"></div><div class="actions"><button class="secondary" data-step="2">${icon('back')}이전</button><button class="primary" id="to-result">결과물 보기 ${icon('arrow')}</button></div></section><aside class="panel"><p class="eyebrow">LIVE STICKER PREVIEW</p><div class="preview-stage"><div class="mockup-scene"><div class="bag"><img id="live-sticker" src="${svgUri(stickerSVG())}" alt="쇼핑백에 붙인 편집 중인 스티커"></div></div></div><p class="preview-caption">원본 이미지 + 선명한 한글 상호명</p><div class="download-info">${icon('image')}<div><strong>스티커 디자인 PNG</strong><small>800 × 800 px · 스티커 바깥 투명 배경</small></div></div></aside></div>`}

 const code=newCode();u.pw=await secretRecord($('#rs-pw').value);u.rc=await secretRecord(normCode(code));u.resetFail=0;u.resetLock=0;u.loginFail=0;u.loginLock=0;saveUsers(all);signIn(id);state={...initial(),name:shop};toast('비밀번호를 바꿨어요.');showCode(code,'home')})};

async function upload(e){const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024){toast('2MB 이하 PNG·JPG·WebP를 선택해주세요.');e.target.value='';return}try{const bmp=await createImageBitmap(file);const c=document.createElement('canvas');const ratio=Math.min(1,640/Math.max(bmp.width,bmp.height));c.width=bmp.width*ratio;c.height=bmp.height*ratio;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);state.customImage=c.toDataURL('image/png');state.generated=false;bmp.close();render();toast('내 캐릭터를 적용했어요.')}catch{toast('이미지를 열 수 없어요. 다른 파일을 선택해주세요.')}}
function save(){try{let rs=records();state.id=state.id||(globalThis.crypto?.randomUUID?.()||'brand-'+Date.now()+'-'+Math.random().toString(36).slice(2));const r={...state,savedAt:Date.now()};const idx=rs.findIndex(x=>x.id===r.id);if(idx>=0)rs[idx]=r;else rs.unshift(r);if(rs.length>12){toast('최대 12개까지 저장할 수 있어요. 기존 브랜드를 정리해주세요.');return}localStorage.setItem(KEY,JSON.stringify(rs));toast('내 브랜드에 저장했어요.')}catch{toast('저장 공간이 부족하거나 저장이 차단됐어요. PNG를 다운로드해주세요.')}}
// 포장 미리보기(CSS로 그린 쇼핑백·상자)를 파일로도 받을 수 있게 같은 모양을 SVG로 다시 그린다

async function download(mode,st=state,btn,suffix){const b=btn||$({sns:'#download-sns',pack:'#download-pack'}[mode]||'#download');b.disabled=true;try{await document.fonts.ready;const svg=mode==='pack'?packSVG(st):mode==='sns'?postSVG(st):stickerSVG(st,mode);const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=svgUri(svg)});const c=document.createElement('canvas');c.width=c.height=mode==='sticker'?800:1080;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);const blob=await new Promise(res=>c.toBlob(res,'image/png'));if(!blob)throw Error();const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=(st.shopName||st.name).replace(/[<>:"/\\|?*]/g,'_')+(suffix||({sns:'_SNS홍보물',pack:'_포장'}[mode]||'_스티커'))+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('PNG 파일을 만들었어요. 다운로드를 확인해주세요.')}catch{toast('다운로드를 완료하지 못했어요. 다시 시도해주세요.')}finally{b.disabled=false}}

async function generateAI(){
 if(generating)return;
 if(!aiReady)return mockGenerate();
 const status=$('#generation-status');
 if(!['http:','https:'].includes(location.protocol)){status.textContent='python server.py로 서버를 실행하고 http://127.0.0.1:8000에서 열어주세요.';return}
 generating=true;
 const controls=[...document.querySelectorAll('button,input,select,textarea')];
 const previous=controls.map(c=>c.disabled);controls.forEach(c=>c.disabled=true);
 status.textContent='서버 연결을 확인하고 있어요…';
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),200000);
 try{
  const healthResponse=await fetch('/api/status',{signal:controller.signal});
  if(!healthResponse.ok)throw Error('Python 서버 주소에서 화면을 열어주세요.');
  const health=await healthResponse.json();
  if(!health.ready)throw Error('서버를 다시 실행하고 API 키를 입력해주세요.');
  status.textContent='캐릭터를 만들고 있어요. 잠시 기다려주세요. 완료 전 창을 닫지 마세요.';
  const payload={...buildBrandRequest(),request_id:crypto.randomUUID()};
  const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json','X-Gageon-Token':health.token,...(await authHeader())},body:JSON.stringify(payload),signal:controller.signal});
  const data=await response.json();if(!response.ok)throw Error(data.error||'생성에 실패했어요.');
  if(typeof data.image!=='string'||!data.image.startsWith('data:image/png;base64,'))throw Error('올바른 이미지를 받지 못했어요.');
  state.customImage=data.image;state.generated=true;state.id=null;render();toast('AI 캐릭터를 적용했어요.');
 }catch(error){status.textContent=error.name==='AbortError'?'응답 대기 시간이 초과됐어요. 서버에서 생성이 계속될 수 있으니 과금 내역을 확인한 뒤 다시 시도해주세요.':error.message||'서버 연결을 확인해주세요.';status.insertAdjacentHTML('beforeend',' <button type="button" class="text-button" id="retry-ai">다시 시도</button>');setTimeout(()=>{if($('#retry-ai'))$('#retry-ai').onclick=generateAI})}
 finally{clearTimeout(timer);generating=false;controls.forEach((c,i)=>c.disabled=previous[i])}
}

// 서버 없이 여는 링크(GitHub Pages)용: 생성 과정을 흉내 내고 업종에 맞는 예시 캐릭터를 결과로 쓴다
async function mockGenerate(){
 const status=$('#generation-status');
 if(used()>=MOCK_LIMIT){status.innerHTML=`<p class="field-error">체험 AI 생성 ${MOCK_LIMIT}회를 모두 썼어요. 직접 만든 캐릭터 이미지를 올려 계속할 수 있어요.</p>`;return}
 generating=true;
 const controls=[...document.querySelectorAll('button,input,select,textarea')];const previous=controls.map(c=>c.disabled);controls.forEach(c=>c.disabled=true);
 const wait=ms=>new Promise(r=>setTimeout(r,ms)),labels=['업종과 가게 특징 읽기','캐릭터 그리기','스티커에 적용하기'],stage=document.querySelector('.preview-stage');
 const show=i=>{status.innerHTML=`<ol class="gen-steps">${labels.map((l,j)=>`<li class="${j<i?'done':j===i?'active':''}">${l}</li>`).join('')}</ol>`};
 stage?.classList.add('is-loading');
 try{show(0);await wait(1000);show(1);await wait(1600);show(2);await wait(700);
  const t=state.industry,type=/한우|소고기|고기|정육/.test(t)?'cow':/카페|커피|디저트|찻집/.test(t)?'coffee':/빵|베이커리|제과|케이크/.test(t)?'bread':'shop';
  state.customImage=svgUri(assets[type]);state.generated=true;state.id=null;try{localStorage.setItem(USAGE_KEY,String(used()+1))}catch{}}
 finally{generating=false;controls.forEach((c,i)=>c.disabled=previous[i])}
 render();toast('캐릭터를 적용했어요. (목업)')}
async function checkAI(){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),3000);const r=await fetch('/api/status',{signal:c.signal});clearTimeout(t);const d=r.ok?await r.json():null;aiReady=!!(d&&d.ready)}catch{aiReady=false}if(aiReady&&page==='studio'&&step===2)render()}
// 소상공인시장진흥공단 상가(상권)정보로 만든 경산시 가게 목록 (scripts/build_stores.py)
async function loadStores(){try{const r=await fetch('data/gyeongsan-stores.json');if(!r.ok)return;stores=await r.json();catCount=stores.cats.map(()=>0);stores.rows.forEach(x=>catCount[x[1]]++);if($('#dong'))$('#dong').innerHTML=dongOptions();if(page==='studio'&&step===2)render()}catch{}}
function dongOptions(){return `<option value="">선택 안 함</option>${stores?[...stores.dongs].sort((a,b)=>a.localeCompare(b,'ko')).map(d=>`<option ${state.dong===d?'selected':''}>${esc(d)}</option>`).join(''):''}`}
const ALIAS={한우:'소고기',떡볶이:'분식',커피:'카페',베이커리:'빵',제과:'빵',술집:'주점',호프:'맥주',삼겹살:'돼지고기',고깃집:'돼지고기',헤어:'미용실'};
const STOP=new Set(['소매업','전문','기타','구이','관련','서비스업','음식점','일반','상품','제품']);
const batchim=w=>(w.charCodeAt(w.length-1)-44032)%28>0;
const PLACE=new Set(['경산','대구','영남','하양','진량','압량','자인','와촌','남산','용성','남천']);
function matchCat(text){let t=text;for(const k in ALIAS)if(t.includes(k))t+=' '+ALIAS[k];let best=-1,score=0;stores.cats.forEach((c,i)=>{const s=c[2].split(/[\/\s·]+/).filter(w=>w.length>=2&&!STOP.has(w)&&t.includes(w)).length;if(s>score||(s&&s===score&&catCount[i]>catCount[best])){score=s;best=i}});return best}
function topWords(names){const df=new Map(),tri=new Map();for(const n of names){const two=new Set(),three=new Set();for(let i=0;i<n.length-1;i++){if(/^[가-힣]{2}$/.test(n.slice(i,i+2)))two.add(n.slice(i,i+2));if(/^[가-힣]{3}$/.test(n.slice(i,i+3)))three.add(n.slice(i,i+3))}two.forEach(w=>df.set(w,(df.get(w)||0)+1));three.forEach(w=>tri.set(w,(tri.get(w)||0)+1))}
 const picked=[];for(const [b,n] of [...df].sort((x,y)=>y[1]-x[1])){if(picked.length>=3||n<3)break;if(PLACE.has(b))continue;
  // 두 단어에 걸친 글자 조합(예: 김밥천국의 '밥천')은 이미 고른 말과 맞닿아 있으면 건너뛴다
  if(picked.some(p=>p.w.includes(b)||p.w.endsWith(b[0])||p.w.startsWith(b[1])))continue;
  let w=b;for(const [t,m] of tri)if(m>=n*.9&&(t.startsWith(b)||t.endsWith(b))&&m>(tri.get(w)||0))w=t;picked.push({w,n})}
 return picked}
function marketCard(){if(!stores)return '';const c=matchCat(state.industry),inDong=x=>!state.dong||stores.dongs[x[0]]===state.dong,place=state.dong||'경산시';
 const src=`<p class="market-src">출처: ${stores.source} (${stores.month} 기준)</p>`;
 if(c<0){const n=stores.rows.filter(inDong).length;return `<div class="market"><div class="market-head">우리 동네 상권</div><p class="market-big">${esc(place)}에는 가게가 <b>${n.toLocaleString()}곳</b> 있어요.</p><p class="help">‘${esc(state.industry)}’와 맞는 업종은 상가정보에서 찾지 못했어요. 업종을 ‘카페’, ‘분식’처럼 적으면 같은 업종 가게를 비교해드려요.</p>${src}</div>`}
 const same=stores.rows.filter(x=>x[1]===c),near=same.filter(inDong),pool=near.length>=10?near:same,words=topWords(pool.map(x=>x[2]));
 const twins=stores.rows.filter(x=>x[2]===state.name.trim()).length,hit=words.find(w=>state.name.includes(w.w));
 const tip=twins?`‘${esc(state.name)}’${batchim(state.name.trim())?'과':'와'} 같은 이름의 가게가 경산시에 ${twins}곳 있어요. 캐릭터를 크게 넣어 우리 가게만의 얼굴을 만들어보세요.`:hit?`이름에 들어간 ‘${esc(hit.w)}’${batchim(hit.w)?'은':'는'} 주변에서 흔한 말이에요. 캐릭터와 색으로 개성을 살려보세요.`:'주변에서 많이 쓰는 말과 겹치지 않아 기억에 잘 남는 이름이에요.';
 return `<div class="market"><div class="market-head">우리 동네 같은 업종</div><p class="market-big">${near.length?`${esc(place)}에 <b>${esc(stores.cats[c][2])}</b> 가게 <b>${near.length.toLocaleString()}곳</b>`:`${esc(place)}에는 아직 <b>${esc(stores.cats[c][2])}</b> 가게가 없어요`}</p><ul>${state.dong?`<li>경산시 전체로는 ${same.length.toLocaleString()}곳이에요.</li>`:'<li>가게 위치를 고르면 동네 기준으로 보여드려요.</li>'}${words.length?`<li>${state.dong&&pool===near?'이 동네':'경산시'} 같은 업종 이름에 자주 쓰인 말: ${words.map(w=>`<b>${esc(w.w)}</b> ${w.n}곳`).join(' · ')}</li>`:''}<li>${tip}</li></ul>${src}</div>`}
async function init(){checkAI();loadStores();try{if(window.GAGEON_ASSETS){assets=window.GAGEON_ASSETS}else{await Promise.all(['cow','coffee','bread','shop'].map(async n=>{const r=await fetch('assets/'+n+'.svg');if(!r.ok)throw Error(n);assets[n]=await r.text()}))}seedSamples();await seedDemo();if(REAL){await restoreSession()}else{try{const id=localStorage.getItem(SESSION_KEY)||'';if(users()[id])signIn(id)}catch{}page=user?'home':'start'}state.name=shop;render()}catch{$('#app').innerHTML='<main class="main"><h1>파일을 불러오지 못했어요.</h1><p>연결을 확인하고 새로고침해주세요.</p></main>'}}
