/* 원래 색은 그대로 두고 제목 글꼴, 카드 두께감, 눌리는 버튼만 더함 */
.eyebrow,.hero-preview .mini{display:none}
.intro h1,.panel-title,.logo,.hero-preview h2,.concept strong,.market-big,.saved-body h3,.guide-grid h3,.empty h2,.sample-logo strong,.download-info strong{font-family:'Jua','Pretendard Variable',sans-serif;font-weight:400;letter-spacing:-.3px}
.intro h1{font-size:31px;line-height:1.3}.panel-title{font-size:21px}
.panel,.feature-strip,.saved-card{box-shadow:0 4px 0 var(--line)}
.choice{border-radius:12px}
.primary{box-shadow:0 4px 0 #2c2723;transition:transform .08s,box-shadow .08s}.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #2c2723}
.bottomnav button.active .icon{background:#eeeae7;border-radius:11px;width:46px;height:25px;padding:2px 12px;box-sizing:border-box}
.market-big{font-size:19px}.guide-grid .num{letter-spacing:0;font-weight:700}
.logo small{margin-left:-6px}
.intro h1,.panel-title,.hero-preview h2,.intro p,.sub,.help{word-break:keep-all}
/* Figma Nucleus UI Lite 기준: 칼선 그림자 대신 흰 카드와 옅은 회색 선, 48px 알약 버튼 */
.panel,.saved-card,.feature-strip{background:#ffffff;border:1px solid #ebe8df;border-radius:24px;box-shadow:0 1px 2px rgba(54,49,45,.05)}
.empty{background:#ffffff;border:1px dashed #d9d6cb;border-radius:24px;box-shadow:none}
input[type=text],select,textarea{min-height:48px;border:1px solid #e3e5e5;border-radius:8px;background:#ffffff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(66,59,53,.14)}
.choice{border:1px solid #e3e5e5;border-radius:999px;background:#ffffff;box-shadow:none}.choice.with-icon{border-radius:16px}
/* Coffee Shop 카테고리 칩처럼 고른 것만 채운다. 아이콘 칩은 그림이 묻히지 않게 연한 색으로 */
.choice.selected{border-color:var(--brand);background:var(--brand);color:#ffffff;box-shadow:none}.choice.with-icon.selected{background:#eeeae7;color:var(--ink)}
.primary{min-height:48px;border:0;border-radius:999px;box-shadow:none;transition:background .15s}
.primary:active:not(:disabled){transform:none;box-shadow:none;background:#352f29}

function assetType(){return state.industry==='소고기 전문점'?'cow':state.industry==='카페'?'coffee':state.industry==='베이커리·디저트'?'bread':'shop'}
function svgUri(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function mascotUri(){return state.customImage||svgUri(assets[assetType()]||assets.shop||'<svg xmlns="http://www.w3.org/2000/svg"/>')}
function stickerSVG(s=state,mode='sticker'){
const t=themes[s.theme]||themes[0],type=s.industry==='소고기 전문점'?'cow':s.industry==='카페'?'coffee':s.industry==='베이커리·디저트'?'bread':'shop';
const raw=s.customImage||svgUri(assets[type]||''),size=mode==='sns'?1080:800,scale=size/800;
const outer=s.shape==='circle'?`<circle cx="400" cy="400" r="390" fill="white"/><circle cx="400" cy="400" r="372" fill="${t.bg}" stroke="${t.accent}" stroke-width="2" stroke-dasharray="4 8"/>`:`<rect x="10" y="10" width="780" height="780" rx="60" fill="white"/><rect x="28" y="28" width="744" height="744" rx="47" fill="${t.bg}" stroke="${t.accent}" stroke-width="2" stroke-dasharray="4 8"/>`;
const nameSize=Math.min(Number(s.fontSize)||58,620/Math.max(s.name.length,1));
return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 800 800">${mode==='sns'?`<rect width="800" height="800" fill="${t.bg}"/><circle cx="400" cy="355" r="270" fill="white" opacity=".45"/>`:outer}<image href="${esc(raw)}" x="170" y="110" width="460" height="430"/><g fill="${t.ink}" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" text-anchor="middle"><text x="400" y="600" font-size="${nameSize}" font-weight="800">${esc(s.name||'우리 가게')}</text><text x="400" y="661" font-size="${Math.min(28,600/Math.max(s.message.length,1))}" letter-spacing="1">${esc(s.message)}</text><text x="400" y="711" font-size="18" opacity=".6">${esc(s.industry)}</text></g></svg>`;
}
function logo(){return `<button class="logo" data-page="home" aria-label="가게온 홈"><span class="logo-mark">${icon('shop')}</span>가게온<small>·</small></button>`}
function nav(cls){return `<nav class="${cls}" aria-label="주요 메뉴">${[['home','home','홈'],['saved','folder','내 브랜드'],['mypage','user','마이페이지']].map(([p,i,l])=>`<button data-page="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${icon(i)}<span>${l}</span></button>`).join('')}</nav>`}
function startPage(){return `<main class="start"><section class="panel"><div class="start-hero" aria-label="가게온으로 만든 예시 브랜드">${samples().reverse().map(b=>`<figure><img src="${svgUri(packSVG({...b,mockup:'bag'}))}" alt="${esc(b.name)} 스티커를 붙인 쇼핑백"><figcaption><b>${esc(b.name)}</b>${esc(b.industry)}</figcaption></figure>`).join('')}</div><div class="start-body"><div class="logo"><span class="logo-mark">${icon('shop')}</span>가게온<small>·</small></div><h1>우리 가게만의 캐릭터를 만들어보세요</h1><p class="sub">디자인 경험이 없어도 괜찮아요. 가게 이름만 적으면 AI와 함께 시작해요.</p><ol class="flow" aria-label="만드는 순서"><li>가게 정보</li><li class="ai-step">AI 캐릭터</li><li>스티커 편집</li><li>포장·SNS 완성</li></ol><form id="start-form" novalidate><div class="field"><label for="shop-name">가게 이름</label><input id="shop-name" type="text" maxlength="24" placeholder="예: 몽글빵집" autocomplete="organization" aria-describedby="shop-error"><p class="field-error" id="shop-error" role="alert" hidden>가게 이름을 적어주세요.</p></div><button class="primary full" type="submit">내 브랜드 만들기 ${icon('arrow')}</button></form><p class="form-foot">${icon('info')}체험 버전이라 비밀번호 없이 이 브라우저에만 기억해요.</p></div></section></main>`}
function render(){
// 단계와 화면을 브라우저 기록에 남겨 휴대폰 뒤로가기로 이전 화면에 가게 한다
if(!history.state||history.state.page!==page||history.state.step!==step)history[history.state?'pushState':'replaceState']({page,step},'');saveDraft();
if(page==='start'){$('#app').innerHTML=startPage();bind();return}
$('#app').innerHTML=`<aside class="sidebar">${logo()}<div class="caption">YOUR LITTLE BRAND STUDIO</div>${nav('nav')}<div class="side-note">${icon('leaf')}<strong>작은 가게, 빛나는 브랜드</strong>사장님의 이야기에<br>우리 가게다운 모습을 더해요.</div></aside><main class="main"><header class="topbar"><div class="mobile-logo">${logo()}</div><div class="breadcrumb">GAGEON STUDIO <span>/ ${({home:'홈',studio:'브랜드 만들기',saved:'내 브랜드',mypage:'마이페이지'})[page]||'이용 가이드'}</span></div><button class="text-button shop-chip" id="logout">${esc(shop)} 사장님 · 나가기</button></header>${page==='studio'?studio():page==='saved'?saved():page==='home'?home():page==='mypage'?mypage():guide()}<footer class="mini-foot"><span>가게온 · 작은 가게의 시작을 응원합니다.</span><span>BRAND YOUR OWN STORY</span></footer></main>${nav('bottomnav')}`;
bind();
}
function home(){const d=draft(),rs=records().slice(0,3),left=Math.max(0,MOCK_LIMIT-used());return `<section class="intro"><h1>${esc(shop)} 사장님, 안녕하세요</h1><p>오늘은 어떤 브랜드를 만들어볼까요?</p></section>
<button class="home-new" id="new-brand">${icon('spark')}<span><strong>새 브랜드 만들기</strong><small>가게 정보 → AI 캐릭터 → 스티커 → 완성</small></span></button>
${d&&d.state&&d.state.name?`<button class="home-resume" id="resume-draft"><img src="${svgUri(stickerSVG({...initial(),...d.state}))}" alt=""><span><strong>${esc(d.state.name)} 이어서 만들기</strong><small>${['가게 정보','AI 캐릭터','스티커 편집','완성'][(d.step||1)-1]} 단계에서 멈췄어요</small></span></button>`:''}
<div class="usage"><div class="usage-row"><span>체험 AI 생성</span><span><b>${left}</b> / ${MOCK_LIMIT}회 남음</span></div><div class="usage-bar"><i style="width:${left/MOCK_LIMIT*100}%"></i></div></div>
<div class="section-head"><h2>최근 작업</h2><button class="text-button" data-page="saved">전체 보기</button></div>
${rs.length?`<div class="recent">${rs.map(r=>`<button data-open="${esc(r.id)}"><img src="${svgUri(stickerSVG(r))}" alt="">${esc(r.name)}</button>`).join('')}</div>`:'<div class="empty"><p>아직 저장한 브랜드가 없어요. 첫 브랜드를 만들어보세요.</p></div>'}`}
function mypage(){const n=records().length;return `<section class="intro"><h1>마이페이지</h1><p>체험 버전이라 정보는 이 브라우저에만 저장돼요.</p></section>
<div class="my-list"><form class="my-name" id="name-form"><input id="my-shop" type="text" maxlength="24" value="${esc(shop)}" aria-label="가게 이름"><button class="secondary" type="submit">이름 변경</button></form></div>
<div class="my-list"><div>저장한 브랜드<small>${n} / 12개</small></div><div>체험 AI 생성<small>${used()} / ${MOCK_LIMIT}회 사용</small></div><button data-page="guide">이용 가이드<small>›</small></button></div>
<div class="my-list"><button id="logout-my">나가기<small>›</small></button><button class="danger" id="wipe">이 브라우저의 가게온 데이터 모두 지우기</button></div>`}
function steps(){return `<div class="steps" aria-label="진행 단계">${['가게 정보','AI 캐릭터','스티커 편집','완성'].map((v,i)=>`${i?'<span class="step-line"></span>':''}<div class="step ${step===i+1?'active':step>i+1?'done':''}" ${step===i+1?'aria-current="step"':''}><b>${step>i+1?'✓':i+1}</b><span class="step-label">${v}</span></div>`).join('')}</div>`}
function studio(){const titles=['어떤 가게인지 알려주세요','AI가 우리 가게 캐릭터를 그려요','스티커를 다듬어요','브랜드가 완성됐어요'];const subs=['몇 가지만 알려주시면 가게에 어울리는 브랜드를 제안해요.','마음에 드는 캐릭터와 색을 골라주세요.','상호명과 문구를 바꾸면 바로 포장에 반영돼요.','스티커, SNS 이미지, 포장 미리보기를 받아 가세요.'];return `<section class="intro"><p class="eyebrow">MAKE YOUR BRAND BLOOM</p><h1>${titles[step-1]}</h1><p>${subs[step-1]}</p></section>${steps()}${step===1?formPage():step===2?conceptPage():step===3?editorPage():resultPage()}`}
function choice(field,values,withIcon=false){return `<div class="choices">${values.map((v,i)=>`<button type="button" class="choice${withIcon?' with-icon':''} ${state[field]===v?'selected':''}" data-field="${field}" data-value="${esc(v)}" aria-pressed="${state[field]===v}">${withIcon?icon(['smile','leaf','spark'][i]):''}${v}</button>`).join('')}</div>`}
function formPage(){return `<div class="layout"><section class="panel"><div class="panel-title">어떤 가게를 운영하시나요?<button type="button" class="text-button" id="fill-example">예시 입력</button></div><p class="sub">가게의 개성이 드러날수록 더 잘 어울리는 브랜드가 돼요.</p><form id="brand-form" novalidate><div class="field"><label for="store-name">가게 이름<span class="required">*</span></label><input id="store-name" name="name" type="text" maxlength="24" aria-required="true" aria-describedby="name-error" placeholder="예: 한우랑" autocomplete="organization" value="${esc(state.name)}"><p class="field-error" id="name-error" role="alert" hidden>가게 이름을 적어주세요.</p></div><div class="field"><label for="industry">가게 업종<span class="required">*</span></label><input id="industry" name="industry" type="text" maxlength="100" aria-required="true" aria-describedby="industry-error" placeholder="예: 꽃집, 반려동물 용품점, 캠핑용 한우 전문점" value="${esc(state.industry)}"><p class="field-error" id="industry-error" role="alert" hidden>어떤 가게인지 적어주세요.</p><p class="help">업종을 자유롭게 적어주세요. AI 연결 후 업종과 가게 특징을 함께 해석해 브랜드를 제안해요.</p></div><div class="field"><label for="dong">가게 위치 <small>경산시 · 선택</small></label><select id="dong">${dongOptions()}</select><p class="help">동네를 고르면 주변에 같은 업종 가게가 몇 곳인지 알려드려요.</p></div><fieldset class="field"><legend>원하는 브랜드 분위기</legend>${choice('mood',['귀엽고 친근한','고급스럽고 차분한','재미있고 개성 있는'],true)}</fieldset><fieldset class="field"><legend>주요 고객층</legend>${choice('audience',['가족','청년','전 연령'])}</fieldset><div class="field"><label for="feature">우리 가게만의 특징 <small>선택</small><span class="counter" id="feature-count">${state.feature.length}/120</span></label><textarea id="feature" name="feature" maxlength="120" placeholder="주력 메뉴나 특별한 서비스를 들려주세요.">${esc(state.feature)}</textarea><p class="help"><strong>예: 캠핑용 한우 포장 세트가 주력</strong><br>대표 상품, 가게의 이야기, 특별한 장점도 좋아요.</p></div><button class="primary full" type="submit">브랜드 콘셉트 미리보기 ${icon('arrow')}</button><p class="form-foot">${icon('info')}예시 캐릭터로 체험할 수 있어요.</p></form></section><aside clas function conceptPage(){const t=themes[state.theme];return `<div class="layout"><section class="panel"><div class="panel-title">${esc(state.name)}의 캐릭터 <span class="ai-badge">${icon('spark')}AI</span></div><p class="sub">입력한 정보를 정리했어요. 마음에 드는 스타일을 골라주세요.</p><div class="notice">${state.generated?(aiReady?'AI가 생성한 캐릭터예요. 같은 원본을 스티커에 재사용해요.':'목업 시연용 결과예요. 실제 서비스에서는 AI가 새로 그린 캐릭터가 들어가요.'):state.customImage?'직접 올린 이미지로 제작 중이에요.':(aiReady?'현재는 예시 캐릭터예요. 아래 버튼으로 AI 생성을 요청할 수 있어요.':'현재는 예시 캐릭터예요. 직접 만든 캐릭터 이미지를 올려 쓸 수도 있어요.')}</div>${aiReady?`<button class="primary ai full" id="generate-ai">${icon('spark')}AI로 새 캐릭터 만들기</button><p class="help">업종과 가게 특징을 반영해 새 캐릭터를 그려요. 1~2분 정도 걸려요.</p>`:`<button class="primary ai full" id="generate-ai">${icon('spark')}AI로 새 캐릭터 만들기</button><p class="help">시연용 목업이에요. 실제 AI 대신 업종에 맞춰 준비해 둔 캐릭터로 결과를 보여드려요. 체험 생성 ${Math.max(0,MOCK_LIMIT-used())}/${MOCK_LIMIT}회 남음</p>`}<div id="generation-status" role="status" aria-live="polite"></div><div class="concept"><strong>${esc(state.mood)} ${esc(state.name)}</strong><p>${state.feature?esc(state.feature):`${esc(state.audience)} 고객에게 친근하게 다가가는 ${esc(state.industry)}`}</p><div class="tags"><span>#${esc(state.industry)}</span><span>#${esc(state.audience)}</span><span>#${esc(state.mood.split(' ')[0])}</span></div></div><details class="market-fold"><summary>우리 동네 같은 업종 가게 보기</summary>${marketCard()}</details><div class="field"><label>브랜드 색상 선택</label><div class="palette-cards">${themes.map((t,i)=>`<button class="palette-card ${i===state.theme?'selected':''}" data-theme="${i}" aria-pressed="${i===state.theme}"><img src="${mascotUri()}" alt="${t.name} 캐릭터 예시" style="background:${t.bg};border-radius:10px"><strong>${t.name}</strong><span class="swatches"><i style="background:${t.bg}"></i><i style="background:${t.accent}"></i><i style="background:${t.ink}"></i></span></button>`).join('')}</div></div><label class="upload-label" for="upload">내 캐릭터로 만들고 싶다면?<input type="file" id="upload" accept="image/png,image/jpeg, function editorPage(){return `<div class="layout"><section class="panel"><div class="panel-title">스티커를 내 마음에 쏙 맞게</div><p class="sub">글자를 수정해도 캐릭터는 그대로 유지돼요.</p><div class="field"><label for="edit-name">상호명</label><input type="text" id="edit-name" maxlength="24" value="${esc(state.name)}"></div><div class="field"><label for="message">스티커 문구</label><input type="text" id="message" maxlength="40" value="${esc(state.message)}"><p class="help">예: 맛있게 드세요! · 오늘도 감사합니다.</p></div><div class="field"><label>스티커 모양</label><div class="choices">${[['circle','원형'],['square','둥근 사각형']].map(([v,l])=>`<button class="choice ${state.shape===v?'selected':''}" data-field="shape" data-value="${v}" aria-pressed="${state.shape===v}">${l}</button>`).join('')}</div></div><div class="field"><label>브랜드 색상</label><div class="color-options">${themes.map((t,i)=>`<button class="color-dot ${state.theme===i?'selected':''}" data-theme="${i}" style="background:${t.accent}" aria-label="${t.name}" aria-pressed="${state.theme===i}"></button>`).join('')}</div></div><div class="field"><label for="font-size">상호명 크기</label><div class="range-row"><input id="font-size" type="range" min="36" max="80" value="${state.fontSize}"><output id="font-value">${state.fontSize}</output></div><p class="help">긴 상호명은 스티커 안에 맞게 자동으로 줄어들어요.</p></div><div class="actions"><button class="secondary" data-step="2">${icon('back')}이전</button><button class="primary" id="to-result">포장에 붙여보기 ${icon('arrow')}</button></div></section><aside class="panel"><p class="eyebrow">LIVE STICKER PREVIEW</p><div class="preview-stage"><div class="mockup-scene"><div class="bag"><img id="live-sticker" src="${svgUri(stickerSVG())}" alt="쇼핑백에 붙인 편집 중인 스티커"></div></div></div><p class="preview-caption">원본 이미지 + 선명한 한글 상호명</p><div class="download-info">${icon('image')}<div><strong>스티커 디자인 PNG</strong><small>800 × 800 px · 스티커 바깥 투명 배경</small></div></div></aside></div>`}

function buildBrandRequest(){return {name:state.name.trim(),industry:state.industry.trim(),mood:state.mood,audience:state.audience,feature:state.feature.trim()}}
function syncForm(){if($('#store-name'))state.name=$('#store-name').value;if($('#industry'))state.industry=$('#industry').value;if($('#dong'))state.dong=$('#dong').value;if($('#feature'))state.feature=$('#feature').value}
function refreshSticker(){if($('#live-sticker'))$('#live-sticker').src=svgUri(stickerSVG())}
function clearError(f,err){if(!f.value.trim())return;f.classList.remove('invalid');f.removeAttribute('aria-invalid');$('#'+err).hidden=true}
function go(n){step=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function bind(){
if($('#generate-ai'))$('#generate-ai').onclick=generateAI;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{syncForm();page=b.dataset.page;render();window.scrollTo({top:0})});
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));

async function upload(e){const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024){toast('2MB 이하 PNG·JPG·WebP를 선택해주세요.');e.target.value='';return}try{const bmp=await createImageBitmap(file);const c=document.createElement('canvas');const ratio=Math.min(1,640/Math.max(bmp.width,bmp.height));c.width=bmp.width*ratio;c.height=bmp.height*ratio;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);state.customImage=c.toDataURL('image/png');state.generated=false;bmp.close();render();toast('내 캐릭터를 적용했어요.')}catch{toast('이미지를 열 수 없어요. 다른 파일을 선택해주세요.')}}
function save(){try{let rs=records();state.id=state.id||(globalThis.crypto?.randomUUID?.()||'brand-'+Date.now()+'-'+Math.random().toString(36).slice(2));const r={...state,savedAt:Date.now()};const idx=rs.findIndex(x=>x.id===r.id);if(idx>=0)rs[idx]=r;else rs.unshift(r);if(rs.length>12){toast('최대 12개까지 저장할 수 있어요. 기존 브랜드를 정리해주세요.');return}localStorage.setItem(KEY,JSON.stringify(rs));toast('내 브랜드에 저장했어요.')}catch{toast('저장 공간이 부족하거나 저장이 차단됐어요. PNG를 다운로드해주세요.')}}

:`<g transform="rotate(-8 540 600)"><rect x="300" y="430" width="480" height="380" fill="#574b3a" opacity=".18" transform="translate(28 34)"/><rect x="300" y="430" width="480" height="340" fill="url(#box)" stroke="#b89a73" stroke-width="2"/><rect x="300" y="770" width="480" height="40" fill="#bd9b71"/><rect x="300" y="470" width="480" height="3" fill="#af8a5d" opacity=".3"/><image href="${s}" x="415" y="475" width="250" height="250" transform="rotate(8 540 600)"/></g>`;

async function download(mode){const b=$({sns:'#download-sns',pack:'#download-pack'}[mode]||'#download');b.disabled=true;try{await document.fonts.ready;const svg=mode==='pack'?packSVG():stickerSVG(state,mode);const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=svgUri(svg)});const c=document.createElement('canvas');c.width=c.height=mode==='sticker'?800:1080;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);const blob=await new Promise(res=>c.toBlob(res,'image/png'));if(!blob)throw Error();const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=state.name.replace(/[<>:"/\\|?*]/g,'_')+({sns:'_SNS',pack:'_포장'}[mode]||'_스티커')+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('PNG 파일을 만들었어요. 다운로드를 확인해주세요.')}catch{toast('다운로드를 완료하지 못했어요. 다시 시도해주세요.')}finally{b.disabled=false}}

async function generateAI(){
 if(generating)return;
 if(!aiReady)return mockGenerate();
 const status=$('#generation-status');
 if(!['http:','https:'].includes(location.protocol)){status.textContent='python server.py로 서버를 실행하고 http://127.0.0.1:8000에서 열어주세요.';return}
 generating=true;
 const controls=[...document.querySelectorAll('button,input,select,textarea')];
 const previous=controls.map(c=>c.disabled);controls.forEach(c=>c.disabled=true);
 status.textContent='서버 연결을 확인하고 있어요…';
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),200000);
 try{
  const healthResponse=await fetch('/api/status',{signal:controller.signal});
  if(!healthResponse.ok)throw Error('Python 서버 주소에서 화면을 열어주세요.');
  const health=await healthResponse.json();
  if(!health.ready)throw Error('서버를 다시 실행하고 API 키를 입력해주세요.');
  status.textContent='캐릭터를 만들고 있어요. 잠시 기다려주세요. 완료 전 창을 닫지 마세요.';
  const payload={...buildBrandRequest(),request_id:crypto.randomUUID()};
  const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json','X-Gageon-Token':health.token},body:JSON.stringify(payload),signal:controller.signal});
  const data=await response.json();if(!response.ok)throw Error(data.error||'생성에 실패했어요.');
  if(typeof data.image!=='string'||!data.image.startsWith('data:image/png;base64,'))throw Error('올바른 이미지를 받지 못했어요.');
  state.customImage=data.image;state.generated=true;state.id=null;render();toast('AI 캐릭터를 적용했어요.');
 }catch(error){status.textContent=error.name==='AbortError'?'응답 대기 시간이 초과됐어요. 서버에서 생성이 계속될 수 있으니 과금 내역을 확인한 뒤 다시 시도해주세요.':error.message||'서버 연결을 확인해주세요.';status.insertAdjacentHTML('beforeend',' <button type="button" class="text-button" id="retry-ai">다시 시도</button>');setTimeout(()=>{if($('#retry-ai'))$('#retry-ai').onclick=generateAI})}
 finally{clearTimeout(timer);generating=false;controls.forEach((c,i)=>c.disabled=previous[i])}
}

// 서버 없이 여는 링크(GitHub Pages)용: 생성 과정을 흉내 내고 업종에 맞는 예시 캐릭터를 결과로 쓴다
async function mockGenerate(){
 const status=$('#generation-status');
 if(used()>=MOCK_LIMIT){status.innerHTML=`<p class="field-error">체험 AI 생성 ${MOCK_LIMIT}회를 모두 썼어요. 직접 만든 캐릭터 이미지를 올려 계속할 수 있어요.</p>`;return}
 generating=true;
 const controls=[...document.querySelectorAll('button,input,select,textarea')];const previous=controls.map(c=>c.disabled);controls.forEach(c=>c.disabled=true);
 const wait=ms=>new Promise(r=>setTimeout(r,ms)),labels=['업종과 가게 특징 읽기','캐릭터 그리기','스티커에 적용하기'],stage=document.querySelector('.preview-stage');
 const show=i=>{status.innerHTML=`<ol class="gen-steps">${labels.map((l,j)=>`<li class="${j<i?'done':j===i?'active':''}">${l}</li>`).join('')}</ol>`};
 stage?.classList.add('is-loading');
 try{show(0);await wait(1000);show(1);await wait(1600);show(2);await wait(700);
  const t=state.industry,type=/한우|소고기|고기|정육/.test(t)?'cow':/카페|커피|디저트|찻집/.test(t)?'coffee':/빵|베이커리|제과|케이크/.test(t)?'bread':'shop';
  state.customImage=svgUri(assets[type]);state.generated=true;state.id=null;try{localStorage.setItem(USAGE_KEY,String(used()+1))}catch{}}
 finally{generating=false;controls.forEach((c,i)=>c.disabled=previous[i])}
 render();toast('캐릭터를 적용했어요. (목업)')}
async function checkAI(){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),3000);const r=await fetch('/api/status',{signal:c.signal});clearTimeout(t);const d=r.ok?await r.json():null;aiReady=!!(d&&d.ready)}catch{aiReady=false}if(aiReady&&page==='studio'&&step===2)render()}
// 소상공인시장진흥공단 상가(상권)정보로 만든 경산시 가게 목록 (scripts/build_stores.py)
async function loadStores(){try{const r=await fetch('data/gyeongsan-stores.json');if(!r.ok)return;stores=await r.json();catCount=stores.cats.map(()=>0);stores.rows.forEach(x=>catCount[x[1]]++);if($('#dong'))$('#dong').innerHTML=dongOptions();if(page==='studio'&&step===2)render()}catch{}}
function dongOptions(){return `<option value="">선택 안 함</option>${stores?[...stores.dongs].sort((a,b)=>a.localeCompare(b,'ko')).map(d=>`<option ${state.dong===d?'selected':''}>${esc(d)}</option>`).join(''):''}`}
const ALIAS={한우:'소고기',떡볶이:'분식',커피:'카페',베이커리:'빵',제과:'빵',술집:'주점',호프:'맥주',삼겹살:'돼지고기',고깃집:'돼지고기',헤어:'미용실'};
const STOP=new Set(['소매업','전문','기타','구이','관련','서비스업','음식점','일반','상품','제품']);
const batchim=w=>(w.charCodeAt(w.length-1)-44032)%28>0;
const PLACE=new Set(['경산','대구','영남','하양','진량','압량','자인','와촌','남산','용성','남천']);
function matchCat(text){let t=text;for(const k in ALIAS)if(t.includes(k))t+=' '+ALIAS[k];let best=-1,score=0;stores.cats.forEach((c,i)=>{const s=c[2].split(/[\/\s·]+/).filter(w=>w.length>=2&&!STOP.has(w)&&t.includes(w)).length;if(s>score||(s&&s===score&&catCount[i]>catCount[best])){score=s;best=i}});return best}
function topWords(names){const df=new Map(),tri=new Map();for(const n of names){const two=new Set(),three=new Set();for(let i=0;i<n.length-1;i++){if(/^[가-힣]{2}$/.test(n.slice(i,i+2)))two.add(n.slice(i,i+2));if(/^[가-힣]{3}$/.test(n.slice(i,i+3)))three.add(n.slice(i,i+3))}two.forEach(w=>df.set(w,(df.get(w)||0)+1));three.forEach(w=>tri.set(w,(tri.get(w)||0)+1))}
 const picked=[];for(const [b,n] of [...df].sort((x,y)=>y[1]-x[1])){if(picked.length>=3||n<3)break;if(PLACE.has(b))continue;
  // 두 단어에 걸친 글자 조합(예: 김밥천국의 '밥천')은 이미 고른 말과 맞닿아 있으면 건너뛴다
  if(picked.some(p=>p.w.includes(b)||p.w.endsWith(b[0])||p.w.startsWith(b[1])))continue;
  let w=b;for(const [t,m] of tri)if(m>=n*.9&&(t.startsWith(b)||t.endsWith(b))&&m>(tri.get(w)||0))w=t;picked.push({w,n})}
 return picked}
function marketCard(){if(!stores)return '';const c=matchCat(state.industry),inDong=x=>!state.dong||stores.dongs[x[0]]===state.dong,place=state.dong||'경산시';
 const src=`<p class="market-src">출처: ${stores.source} (${stores.month} 기준)</p>`;
 if(c<0){const n=stores.rows.filter(inDong).length;return `<div class="market"><div class="market-head">우리 동네 상권</div><p class="market-big">${esc(place)}에는 가게가 <b>${n.toLocaleString()}곳</b> 있어요.</p><p class="help">‘${esc(state.industry)}’와 맞는 업종은 상가정보에서 찾지 못했어요. 업종을 ‘카페’, ‘분식’처럼 적으면 같은 업종 가게를 비교해드려요.</p>${src}</div>`}
 const same=stores.rows.filter(x=>x[1]===c),near=same.filter(inDong),pool=near.length>=10?near:same,words=topWords(pool.map(x=>x[2]));
 const twins=stores.rows.filter(x=>x[2]===state.name.trim()).length,hit=words.find(w=>state.name.includes(w.w));
 const tip=twins?`‘${esc(state.name)}’${batchim(state.name.trim())?'과':'와'} 같은 이름의 가게가 경산시에 ${twins}곳 있어요. 캐릭터를 크게 넣어 우리 가게만의 얼굴을 만들어보세요.`:hit?`이름에 들어간 ‘${esc(hit.w)}’${batchim(hit.w)?'은':'는'} 주변에서 흔한 말이에요. 캐릭터와 색으로 개성을 살려보세요.`:'주변에서 많이 쓰는 말과 겹치지 않아 기억에 잘 남는 이름이에요.';
 return `<div class="market"><div class="market-head">우리 동네 같은 업종</div><p class="market-big">${near.length?`${esc(place)}에 <b>${esc(stores.cats[c][2])}</b> 가게 <b>${near.length.toLocaleString()}곳</b>`:`${esc(place)}에는 아직 <b>${esc(stores.cats[c][2])}</b> 가게가 없어요`}</p><ul>${state.dong?`<li>경산시 전체로는 ${same.length.toLocaleString()}곳이에요.</li>`:'<li>가게 위치를 고르면 동네 기준으로 보여드려요.</li>'}${words.length?`<li>${state.dong&&pool===near?'이 동네':'경산시'} 같은 업종 이름에 자주 쓰인 말: ${words.map(w=>`<b>${esc(w.w)}</b> ${w.n}곳`).join(' · ')}</li>`:''}<li>${tip}</li></ul>${src}</div>`}
