const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={shop:'M3 10h18M4 10v11h16V10M2 10l3-7h14l3 7M9 21v-7h6v7M2 10c0 4 5 4 5 0 0 4 5 4 5 0 0 4 5 4 5 0 0 4 5 4 5 0',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3M20 2v4M18 4h4',folder:'M3 6h7l2 3h9v11H3V6Z',book:'M3 4h6c2 0 3 1 3 2 0-1 1-2 3-2h6v16h-6c-2 0-3 1-3 2 0-1-1-2-3-2H3V4ZM12 6v16',arrow:'M4 12h16m-6-6 6 6-6 6',back:'M20 12H4m6-6-6 6 6 6',check:'m5 12 4 4L19 6',download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',smile:'M8 9h.1M16 9h.1M8 14c2 3 6 3 8 0M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',heart:'M12 21S1 14 3 7c2-5 7-4 9 0 2-4 7-5 9 0 2 7-9 14-9 14Z',box:'m3 7 9-4 9 4v13l-9 3-9-3V7Zm0 0 9 4 9-4M12 11v12M7 5l9 4',info:'M12 11v6M12 7h.1M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',save:'M5 3h12l4 4v14H3V3h2Zm2 0v7h10V3M7 21v-7h10v7',image:'M3 3h18v18H3V3Zm0 14 6-6 4 4 3-3 5 5M16 7h.1',leaf:'M20 3C8 1 1 8 6 15c7 7 16 0 14-12ZM4 21 16 9'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[n]||icons.spark}"/></svg>`;
const themes=[{name:'포근한 크림',bg:'#fff4df',ink:'#664633',accent:'#d9955f'},{name:'따뜻한 코랄',bg:'#ffe5da',ink:'#8a4436',accent:'#ed8a6a'},{name:'차분한 세이지',bg:'#e7eedc',ink:'#455e3b',accent:'#8ba370'}];
const initial=()=>({name:'',industry:'',mood:'귀엽고 친근한',audience:'전 연령',feature:'',theme:0,shape:'circle',message:'맛있게 드세요!',fontSize:58,mockup:'bag',customImage:null,id:null,dong:''});
let state=initial(),page='studio',step=1,assets={},toastTimer;
let generating=false;let aiReady=false;let stores=null,catCount=[];
const KEY='gageon-brands-v1';
function records(){try{const r=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(r)?r:[]}catch{return[]}}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('toast');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('toast'),3200)}
function assetType(){return state.industry==='소고기 전문점'?'cow':state.industry==='카페'?'coffee':state.industry==='베이커리·디저트'?'bread':'shop'}
function svgUri(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function mascotUri(){return state.customImage||svgUri(assets[assetType()]||assets.shop||'<svg xmlns="http://www.w3.org/2000/svg"/>')}
function stickerSVG(s=state,mode='sticker'){
const t=themes[s.theme]||themes[0],type=s.industry==='소고기 전문점'?'cow':s.industry==='카페'?'coffee':s.industry==='베이커리·디저트'?'bread':'shop';
const raw=s.customImage||svgUri(assets[type]||''),size=mode==='sns'?1080:800,scale=size/800;
const outer=s.shape==='circle'?`<circle cx="400" cy="400" r="390" fill="white"/><circle cx="400" cy="400" r="372" fill="${t.bg}" stroke="${t.accent}" stroke-width="2" stroke-dasharray="4 8"/>`:`<rect x="10" y="10" width="780" height="780" rx="60" fill="white"/><rect x="28" y="28" width="744" height="744" rx="47" fill="${t.bg}" stroke="${t.accent}" stroke-width="2" stroke-dasharray="4 8"/>`;
const nameSize=Math.min(Number(s.fontSize)||58,620/Math.max(s.name.length,1));
return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 800 800">${mode==='sns'?`<rect width="800" height="800" fill="${t.bg}"/><circle cx="400" cy="355" r="270" fill="white" opacity=".45"/>`:outer}<image href="${esc(raw)}" x="170" y="110" width="460" height="430"/><g fill="${t.ink}" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" text-anchor="middle"><text x="400" y="600" font-size="${nameSize}" font-weight="800">${esc(s.name||'우리 가게')}</text><text x="400" y="661" font-size="${Math.min(28,600/Math.max(s.message.length,1))}" letter-spacing="1">${esc(s.message)}</text><text x="400" y="711" font-size="18" opacity=".6">${esc(s.industry)}</text></g></svg>`;
}
function logo(){return `<button class="logo" data-page="studio" aria-label="가게온 홈"><span class="logo-mark">${icon('shop')}</span>가게온<small>·</small></button>`}
function nav(cls){return `<nav class="${cls}" aria-label="주요 메뉴">${[['studio','spark','브랜드 만들기'],['saved','folder','내 브랜드'],['guide','book','이용 가이드']].map(([p,i,l])=>`<button data-page="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${icon(i)}<span>${l}</span></button>`).join('')}</nav>`}
function render(){
$('#app').innerHTML=`<aside class="sidebar">${logo()}<div class="caption">YOUR LITTLE BRAND STUDIO</div>${nav('nav')}<div class="side-note">${icon('leaf')}<strong>작은 가게, 빛나는 브랜드</strong>사장님의 이야기에<br>우리 가게다운 모습을 더해요.</div></aside><main class="main"><header class="topbar"><div class="mobile-logo">${logo()}</div><div class="breadcrumb">GAGEON STUDIO <span>/ ${page==='studio'?'브랜드 만들기':page==='saved'?'내 브랜드':'이용 가이드'}</span></div></header>${page==='studio'?studio():page==='saved'?saved():guide()}<footer class="mini-foot"><span>가게온 · 작은 가게의 시작을 응원합니다.</span><span>BRAND YOUR OWN STORY</span></footer></main>${nav('bottomnav')}`;
bind();
}
function steps(){return `<div class="steps" aria-label="진행 단계">${['가게 정보','브랜드 선택','스티커 제작','미리보기'].map((v,i)=>`${i?'<span class="step-line"></span>':''}<div class="step ${step===i+1?'active':step>i+1?'done':''}" ${step===i+1?'aria-current="step"':''}><b>${step>i+1?'✓':i+1}</b><span class="step-label">${v}</span></div>`).join('')}</div>`}
function studio(){const titles=['우리 가게에, <em>우리다운 얼굴을.</em>','가게의 이야기가<br><em>브랜드가 되는 순간.</em>','작은 스티커에 담은<br><em>우리 가게의 매력.</em>','어디에 붙여도,<br><em>한눈에 우리 가게.</em>'];const subs=['몇 가지 이야기만 들려주세요. 가게에 어울리는 브랜드를 함께 만들어요.','마음에 드는 분위기를 고르고, 우리 가게의 얼굴을 정해보세요.','상호명과 문구를 직접 바꾸며 딱 맞는 디자인을 완성하세요.','포장에 적용한 모습을 확인하고, 디자인을 가져가세요.'];return `<section class="intro"><p class="eyebrow">MAKE YOUR BRAND BLOOM</p><h1>${titles[step-1]}</h1><p>${subs[step-1]}</p></section>${steps()}${step===1?formPage():step===2?conceptPage():step===3?editorPage():resultPage()}`}
function choice(field,values,withIcon=false){return `<div class="choices">${values.map((v,i)=>`<button type="button" class="choice${withIcon?' with-icon':''} ${state[field]===v?'selected':''}" data-field="${field}" data-value="${esc(v)}" aria-pressed="${state[field]===v}">${withIcon?icon(['smile','leaf','spark'][i]):''}${v}</button>`).join('')}</div>`}
function formPage(){return `<div class="layout"><section class="panel"><div class="panel-title">어떤 가게를 운영하시나요?<button type="button" class="text-button" id="fill-example">예시 입력</button></div><p class="sub">가게의 개성이 드러날수록 더 잘 어울리는 브랜드가 돼요.</p><form id="brand-form" novalidate><div class="field"><label for="store-name">가게 이름<span class="required">*</span></label><input id="store-name" name="name" type="text" maxlength="24" aria-required="true" aria-describedby="name-error" placeholder="예: 한우랑" autocomplete="organization" value="${esc(state.name)}"><p class="field-error" id="name-error" role="alert" hidden>가게 이름을 적어주세요.</p></div><div class="field"><label for="industry">가게 업종<span class="required">*</span></label><input id="industry" name="industry" type="text" maxlength="100" aria-required="true" aria-describedby="industry-error" placeholder="예: 꽃집, 반려동물 용품점, 캠핑용 한우 전문점" value="${esc(state.industry)}"><p class="field-error" id="industry-error" role="alert" hidden>어떤 가게인지 적어주세요.</p><p class="help">업종을 자유롭게 적어주세요. AI 연결 후 업종과 가게 특징을 함께 해석해 브랜드를 제안해요.</p></div><div class="field"><label for="dong">가게 위치 <small>경산시 · 선택</small></label><select id="dong">${dongOptions()}</select><p class="help">동네를 고르면 주변에 같은 업종 가게가 몇 곳인지 알려드려요.</p></div><fieldset class="field"><legend>원하는 브랜드 분위기</legend>${choice('mood',['귀엽고 친근한','고급스럽고 차분한','재미있고 개성 있는'],true)}</fieldset><fieldset class="field"><legend>주요 고객층</legend>${choice('audience',['가족','청년','전 연령'])}</fieldset><div class="field"><label for="feature">우리 가게만의 특징 <small>선택</small><span class="counter" id="feature-count">${state.feature.length}/120</span></label><textarea id="feature" name="feature" maxlength="120" placeholder="주력 메뉴나 특별한 서비스를 들려주세요.">${esc(state.feature)}</textarea><p class="help"><strong>예: 캠핑용 한우 포장 세트가 주력</strong><br>대표 상품, 가게의 이야기, 특별한 장점도 좋아요.</p></div><button class="primary full" type="submit">브랜드 콘셉트 미리보기 ${icon('arrow')}</button><p class="form-foot">${icon('info')}예시 캐릭터로 체험할 수 있어요.</p></form></section><aside clas function conceptPage(){const t=themes[state.theme];return `<div class="layout"><section class="panel"><div class="panel-title">${esc(state.name)}의 브랜드 노트</div><p class="sub">입력한 정보를 정리했어요. 마음에 드는 스타일을 골라주세요.</p><div class="notice">${state.generated?(aiReady?'AI가 생성한 캐릭터예요. 같은 원본을 스티커에 재사용해요.':'목업 시연용 결과예요. 실제 서비스에서는 AI가 새로 그린 캐릭터가 들어가요.'):state.customImage?'직접 올린 이미지로 제작 중이에요.':(aiReady?'현재는 예시 캐릭터예요. 아래 버튼으로 AI 생성을 요청할 수 있어요.':'현재는 예시 캐릭터예요. 직접 만든 캐릭터 이미지를 올려 쓸 수도 있어요.')}</div>${aiReady?`<button class="primary full" id="generate-ai">${icon('spark')}AI로 새 캐릭터 만들기</button><p class="help">업종과 가게 특징을 반영해 새 캐릭터를 그려요. 1~2분 정도 걸려요.</p>`:`<button class="primary full" id="generate-ai">${icon('spark')}AI로 새 캐릭터 만들기</button><p class="help">시연용 목업이에요. 실제 AI 대신 업종에 맞춰 준비해 둔 캐릭터로 결과를 보여드려요.</p>`}<p id="generation-status" role="status" aria-live="polite"></p><div class="concept"><strong>${esc(state.mood)} ${esc(state.name)}</strong><p>${state.feature?esc(state.feature):`${esc(state.audience)} 고객에게 친근하게 다가가는 ${esc(state.industry)}`}</p><div class="tags"><span>#${esc(state.industry)}</span><span>#${esc(state.audience)}</span><span>#${esc(state.mood.split(' ')[0])}</span></div></div>${marketCard()}<div class="field"><label>브랜드 색상 선택</label><div class="palette-cards">${themes.map((t,i)=>`<button class="palette-card ${i===state.theme?'selected':''}" data-theme="${i}" aria-pressed="${i===state.theme}"><img src="${mascotUri()}" alt="${t.name} 캐릭터 예시" style="background:${t.bg};border-radius:10px"><strong>${t.name}</strong><span class="swatches"><i style="background:${t.bg}"></i><i style="background:${t.accent}"></i><i style="background:${t.ink}"></i></span></button>`).join('')}</div></div><label class="upload-label" for="upload">내 캐릭터로 만들고 싶다면?<input type="file" id="upload" accept="image/png,image/jpeg,image/webp"><span>PNG·JPG·WebP, 2MB 이하 · 투명 PNG 권장</span></label>${state.customImage?'<button class="text-button" id="reset-image">예시 캐릭터로 돌아가기</button>':''}<div class="actions"><button class="secondary" data-step="1">${icon('back')}이전</button><button class="primary" data-step="3">이 브랜드로 만들기 ${icon('arrow')}</button></div></section><aside class="panel"><p class="eyebrow">YOUR BRAND PREVIEW</p><div class="preview-stage"><img class="big-sticker" src="${svgUri(stickerSVG())}" alt="${esc(state.name)} 브랜드 미리보기"></div><p class="preview-caption">선택한 캐릭터와 색상은 다음 단계에도 유지돼요.</p><div class="note">${icon('save')}완성한 브랜드를 저장하면 다음에도 같은 캐릭터로 만들 수 있어요.</div></aside></div>`}
function editorPage(){return `<div class="layout"><section class="panel"><div class="panel-title">스티커를 내 마음에 쏙 맞게</div><p class="sub">글자를 수정해도 캐릭터는 그대로 유지돼요.</p><div class="field"><label for="edit-name">상호명</label><input type="text" id="edit-name" maxlength="24" value="${esc(state.name)}"></div><div class="field"><label for="message">스티커 문구</label><input type="text" id="message" maxlength="40" value="${esc(state.message)}"><p class="help">예: 맛있게 드세요! · 오늘도 감사합니다.</p></div><div class="field"><label>스티커 모양</label><div class="choices">${[['circle','원형'],['square','둥근 사각형']].map(([v,l])=>`<button class="choice ${state.shape===v?'selected':''}" data-field="shape" data-value="${v}" aria-pressed="${state.shape===v}">${l}</button>`).join('')}</div></div><div class="field"><label>브랜드 색상</label><div class="color-options">${themes.map((t,i)=>`<button class="color-dot ${state.theme===i?'selected':''}" data-theme="${i}" style="background:${t.accent}" aria-label="${t.name}" aria-pressed="${state.theme===i}"></button>`).join('')}</div></div><div class="field"><label for="font-size">상호명 크기</label><div class="range-row"><input id="font-size" type="range" min="36" max="80" value="${state.fontSize}"><output id="font-value">${state.fontSize}</output></div><p class="help">긴 상호명은 스티커 안에 맞게 자동으로 줄어들어요.</p></div><div class="actions"><button class="secondary" data-step="2">${icon('back')}이전</button><button class="primary" id="to-result">포장에 붙여보기 ${icon('arrow')}</button></div></section><aside class="panel"><p class="eyebrow">LIVE STICKER PREVIEW</p><div class="preview-stage"><img id="live-sticker" class="big-sticker" src="${svgUri(stickerSVG())}" alt="편집 중인 스티커"></div><p class="preview-caption">원본 이미지 + 선명한 한글 상호명</p><div class="download-info">${icon('image')}<div><strong>스티커 디자인 PNG</strong><small>800 × 800 px · 스티커 바깥 투명 배경</small></div></div></aside></div>`}
function resultPage(){return `<div class="layout"><section class="panel"><div class="panel-title success-title">${icon('check')}우리 가게의 브랜드가 완성됐어요</div><p class="sub">미리보기는 참고용이며 실제 인쇄 결과와 차이가 있을 수 있어요.</p><div class="choices"><button class="choice ${state.mockup==='bag'?'selected':''}" data-field="mockup" data-value="bag">종이 쇼핑백</button><button class="choice ${state.mockup==='box'?'selected':''}" data-field="mockup" data-value="box">포장 상자</button></div><div class="mockup-scene"><div class="${state.mockup}"><img src="${svgUri(stickerSVG())}" alt="${esc(state.name)} 스티커를 적용한 ${state.mockup==='bag'?'종이 쇼핑백':'포장 상자'}"></div></div><p class="preview-caption">한 번 만든 캐릭터, 다양한 곳에서 같은 모습으로.</p><button class="secondary full" style="margin-top:20px" data-step="3">${icon('back')}디자인 더 다듬기</button></section><aside class="panel"><p class="eyebrow">READY FOR YOUR SHOP</p><div class="panel-title">${esc(state.name)} 브랜드 패키지</div><img class="big-sticker" src="${svgUri(stickerSVG())}" alt="완성된 스티커"><button class="primary full" id="download">${icon('download')}스티커 PNG 다운로드</button><button class="secondary full" style="margin-top:10px" id="download-sns">${icon('image')}SNS 이미지 다운로드</button><button class="secondary full" style="margin-top:10px" id="save">${icon('save')}내 브랜드에 저장</button><p class="help">스티커 800 × 800 px / SNS 1080 × 1080 px<br>현재 브라우저에 저장돼요. 앱·기기 간 동기화는 제공하지 않아요.</p><div class="note">${icon('info')}실물 주문은 추후 제공 예정이에요. 인쇄 전 제작 업체의 규격을 확인해주세요.</div></aside></div>`}

function buildBrandRequest(){return {name:state.name.trim(),industry:state.industry.trim(),mood:state.mood,audience:state.audience,feature:state.feature.trim()}}
function syncForm(){if($('#store-name'))state.name=$('#store-name').value;if($('#industry'))state.industry=$('#industry').value;if($('#dong'))state.dong=$('#dong').value;if($('#feature'))state.feature=$('#feature').value}
function refreshSticker(){if($('#live-sticker'))$('#live-sticker').src=svgUri(stickerSVG())}
function clearError(f,err){if(!f.value.trim())return;f.classList.remove('invalid');f.removeAttribute('aria-invalid');$('#'+err).hidden=true}
function go(n){step=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function bind(){
if($('#generate-ai'))$('#generate-ai').onclick=generateAI;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{syncForm();page=b.dataset.page;render();window.scrollTo({top:0})});
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));
document.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{syncForm();state[b.dataset.field]=b.dataset.value;if(step===1){document.querySelectorAll('[data-field]').forEach(x=>{const selected=state[x.dataset.field]===x.dataset.value;x.classList.toggle('selected',selected);x.setAttribute('aria-pressed',String(selected))})}else render()});
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=Number(b.dataset.theme);render()});
if($('#brand-form'))$('#brand-form').onsubmit=e=>{e.preventDefault();syncForm();state.name=state.name.trim();const empty=[['store-name','name-error',state.name],['industry','industry-error',state.industry.trim()]].filter(x=>!x[2]);empty.forEach(([id,err])=>{const f=$('#'+id);f.classList.add('invalid');f.setAttribute('aria-invalid','true');$('#'+err).hidden=false});if(empty.length){const f=$('#'+empty[0][0]);f.scrollIntoView({behavior:'smooth',block:'center'});f.focus({preventScroll:true});return}go(2)};
if($('#store-name'))$('#store-name').oninput=e=>{state.name=e.target.value;clearError(e.target,'name-error')};
if($('#dong'))$('#dong').onchange=e=>{state.dong=e.target.value};
if($('#industry'))$('#industry').oninput=e=>{state.industry=e.target.value;clearError(e.target,'industry-error')};
if($('#feature'))$('#feature').oninput=()=>{state.feature=$('#feature').value;$('#feature-count').textContent=state.feature.length+'/120'};
if($('#fill-example'))$('#fill-example').onclick=()=>{state={...initial(),name:'한우랑',industry:'소고기 전문점',feature:'캠핑용 한우 포장 세트가 주력',audience:'가족'};render();toast('한우랑 예시를 입력했어요. 자유롭게 바꿔보세요.')};
if($('#edit-name'))$('#edit-name').oninput=e=>{state.name=e.target.value;refreshSticker()};
if($('#message'))$('#message').oninput=e=>{state.message=e.target.value;refreshSticker()};
if($('#font-size'))$('#font-size').oninput=e=>{state.fontSize=Number(e.target.value);$('#font-value').value=state.fontSize;refreshSticker()};
if($('#to-result'))$('#to-result').onclick=()=>{state.name=state.name.trim();if(!state.name){toast('상호명을 입력해주세요.');$('#edit-name').focus();return}go(4)};
if($('#upload'))$('#upload').onchange=upload;
if($('#reset-image'))$('#reset-image').onclick=()=>{state.customImage=null;state.generated=false;render()};
if($('#download'))$('#download').onclick=()=>download('sticker');
if($('#download-sns'))$('#download-sns').onclick=()=>download('sns');
if($('#save'))$('#save').onclick=save;
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const r=records().find(r=>r.id===b.dataset.open);if(r){state={...initial(),...r};page='studio';go(3)}});
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('이 브라우저에 저장된 브랜드를 삭제할까요?')){try{localStorage.setItem(KEY,JSON.stringify(records().filter(r=>r.id!==b.dataset.delete)));render();toast('브랜드를 삭제했어요.')}catch{toast('삭제하지 못했어요. 브라우저 저장 설정을 확인해주세요.')}}});
}
async function upload(e){const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024){toast('2MB 이하 PNG·JPG·WebP를 선택해주세요.');e.target.value='';return}try{const bmp=await createImageBitmap(file);const c=document.createElement('canvas');const ratio=Math.min(1,640/Math.max(bmp.width,bmp.height));c.width=bmp.width*ratio;c.height=bmp.height*ratio;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);state.customImage=c.toDataURL('image/png');state.generated=false;bmp.close();render();toast('내 캐릭터를 적용했어요.')}catch{toast('이미지를 열 수 없어요. 다른 파일을 선택해주세요.')}}
function save(){try{let rs=records();state.id=state.id||(globalThis.crypto?.randomUUID?.()||'brand-'+Date.now()+'-'+Math.random().toString(36).slice(2));const r={...state,savedAt:Date.now()};const idx=rs.findIndex(x=>x.id===r.id);if(idx>=0)rs[idx]=r;else rs.unshift(r);if(rs.length>12){toast('최대 12개까지 저장할 수 있어요. 기존 브랜드를 정리해주세요.');return}localStorage.setItem(KEY,JSON.stringify(rs));toast('내 브랜드에 저장했어요.')}catch{toast('저장 공간이 부족하거나 저장이 차단됐어요. PNG를 다운로드해주세요.')}}
async function download(mode){const b=mode==='sns'?$('#download-sns'):$('#download');b.disabled=true;try{await document.fonts.ready;const svg=stickerSVG(state,mode);const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=svgUri(svg)});const c=document.createElement('canvas');c.width=c.height=mode==='sns'?1080:800;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);const blob=await new Promise(res=>c.toBlob(res,'image/png'));if(!blob)throw Error();const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=state.name.replace(/[<>:"/\\|?*]/g,'_')+(mode==='sns'?'_SNS':'_스티커')+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('PNG 파일을 만들었어요. 다운로드를 확인해주세요.')}catch{toast('다운로드를 완료하지 못했어요. 다시 시도해주세요.')}finally{b.disabled=false}}

async function generateAI(){
 if(generating)return;
 if(!aiReady)return mockGenerate();
 const status=$('#generation-status');
 if(!['http:','https:'].includes(location.protocol)){status.textContent='python server.py로 서버를 실행하고 http://127.0.0.1:8000에서 열어주세요.';return}
 generating=true;
 const controls=[...document.querySelectorAll('button,input,select,textarea')];
 const previous=controls.map(c=>c.disabled);controls.forEach(c=>c.disabled=true);
 status.textContent='서버 연결을 확인하고 있어요…';
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),200000);
 try{
  const healthResponse=await fetch('/api/status',{signal:controller.signal});
  if(!healthResponse.ok)throw Error('Python 서버 주소에서 화면을 열어주세요.');
  const health=await healthResponse.json();
  if(!health.ready)throw Error('서버를 다시 실행하고 API 키를 입력해주세요.');
  status.textContent='캐릭터를 만들고 있어요. 잠시 기다려주세요. 완료 전 창을 닫지 마세요.';
  const payload={...buildBrandRequest(),request_id:crypto.randomUUID()};
  const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json','X-Gageon-Token':health.token},body:JSON.stringify(payload),signal:controller.signal});
  const data=await response.json();if(!response.ok)throw Error(data.error||'생성에 실패했어요.');
  if(typeof data.image!=='string'||!data.image.startsWith('data:image/png;base64,'))throw Error('올바른 이미지를 받지 못했어요.');
  state.customImage=data.image;state.generated=true;state.id=null;render();toast('AI 캐릭터를 적용했어요.');
 }catch(error){status.textContent=error.name==='AbortError'?'응답 대기 시간이 초과됐어요. 서버에서 생성이 계속될 수 있으니 과금 내역을 확인한 뒤 다시 시도해주세요.':error.message||'서버 연결을 확인해주세요.'}
 finally{clearTimeout(timer);generating=false;controls.forEach((c,i)=>c.disabled=previous[i])}
}

// 서버 없이 여는 링크(GitHub Pages)용: 생성 과정을 흉내 내고 업종에 맞는 예시 캐릭터를 결과로 쓴다
async function mockGenerate(){
 generating=true;const status=$('#generation-status');
 const controls=[...document.querySelectorAll('button,input,select,textarea')];const previous=controls.map(c=>c.disabled);controls.forEach(c=>c.disabled=true);
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 try{status.textContent='업종과 가게 특징을 읽고 있어요…';await wait(1200);status.textContent='캐릭터를 그리고 있어요…';await wait(1600);
  const t=state.industry,type=/한우|소고기|고기|정육/.test(t)?'cow':/카페|커피|디저트|찻집/.test(t)?'coffee':/빵|베이커리|제과|케이크/.test(t)?'bread':'shop';
  state.customImage=svgUri(assets[type]);state.generated=true;state.id=null}
 finally{generating=false;controls.forEach((c,i)=>c.disabled=previous[i])}
 render();toast('캐릭터를 적용했어요. (목업)')}
async function checkAI(){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),3000);const r=await fetch('/api/status',{signal:c.signal});clearTimeout(t);const d=r.ok?await r.json():null;aiReady=!!(d&&d.ready)}catch{aiReady=false}if(aiReady&&page==='studio'&&step===2)render()}
// 소상공인시장진흥공단 상가(상권)정보로 만든 경산시 가게 목록 (scripts/build_stores.py)
async function loadStores(){try{const r=await fetch('data/gyeongsan-stores.json');if(!r.ok)return;stores=await r.json();catCount=stores.cats.map(()=>0);stores.rows.forEach(x=>catCount[x[1]]++);if($('#dong'))$('#dong').innerHTML=dongOptions();if(page==='studio'&&step===2)render()}catch{}}
function dongOptions(){return `<option value="">선택 안 함</option>${stores?[...stores.dongs].sort((a,b)=>a.localeCompare(b,'ko')).map(d=>`<option ${state.dong===d?'selected':''}>${esc(d)}</option>`).join(''):''}`}
const ALIAS={한우:'소고기',떡볶이:'분식',커피:'카페',베이커리:'빵',제과:'빵',술집:'주점',호프:'맥주',삼겹살:'돼지고기',고깃집:'돼지고기',헤어:'미용실'};
const STOP=new Set(['소매업','전문','기타','구이','관련','서비스업','음식점','일반','상품','제품']);
const batchim=w=>(w.charCodeAt(w.length-1)-44032)%28>0;
const PLACE=new Set(['경산','대구','영남','하양','진량','압량','자인','와촌','남산','용성','남천']);
function matchCat(text){let t=text;for(const k in ALIAS)if(t.includes(k))t+=' '+ALIAS[k];let best=-1,score=0;stores.cats.forEach((c,i)=>{const s=c[2].split(/[\/\s·]+/).filter(w=>w.length>=2&&!STOP.has(w)&&t.includes(w)).length;if(s>score||(s&&s===score&&catCount[i]>catCount[best])){score=s;best=i}});return best}
function topWords(names){const df=new Map(),tri=new Map();for(const n of names){const two=new Set(),three=new Set();for(let i=0;i<n.length-1;i++){if(/^[가-힣]{2}$/.test(n.slice(i,i+2)))two.add(n.slice(i,i+2));if(/^[가-힣]{3}$/.test(n.slice(i,i+3)))three.add(n.slice(i,i+3))}two.forEach(w=>df.set(w,(df.get(w)||0)+1));three.forEach(w=>tri.set(w,(tri.get(w)||0)+1))}
 const picked=[];for(const [b,n] of [...df].sort((x,y)=>y[1]-x[1])){if(picked.length>=3||n<3)break;if(PLACE.has(b))continue;
  // 두 단어에 걸친 글자 조합(예: 김밥천국의 '밥천')은 이미 고른 말과 맞닿아 있으면 건너뛴다
  if(picked.some(p=>p.w.includes(b)||p.w.endsWith(b[0])||p.w.startsWith(b[1])))continue;
  let w=b;for(const [t,m] of tri)if(m>=n*.9&&(t.startsWith(b)||t.endsWith(b))&&m>(tri.get(w)||0))w=t;picked.push({w,n})}
 return picked}
function marketCard(){if(!stores)return '';const c=matchCat(state.industry),inDong=x=>!state.dong||stores.dongs[x[0]]===state.dong,place=state.dong||'경산시';
 const src=`<p class="market-src">출처: ${stores.source} (${stores.month} 기준)</p>`;
 if(c<0){const n=stores.rows.filter(inDong).length;return `<div class="market"><div class="market-head">우리 동네 상권</div><p class="market-big">${esc(place)}에는 가게가 <b>${n.toLocaleString()}곳</b> 있어요.</p><p class="help">‘${esc(state.industry)}’와 맞는 업종은 상가정보에서 찾지 못했어요. 업종을 ‘카페’, ‘분식’처럼 적으면 같은 업종 가게를 비교해드려요.</p>${src}</div>`}
 const same=stores.rows.filter(x=>x[1]===c),near=same.filter(inDong),pool=near.length>=10?near:same,words=topWords(pool.map(x=>x[2]));
 const twins=stores.rows.filter(x=>x[2]===state.name.trim()).length,hit=words.find(w=>state.name.includes(w.w));
 const tip=twins?`‘${esc(state.name)}’${batchim(state.name.trim())?'과':'와'} 같은 이름의 가게가 경산시에 ${twins}곳 있어요. 캐릭터를 크게 넣어 우리 가게만의 얼굴을 만들어보세요.`:hit?`이름에 들어간 ‘${esc(hit.w)}’${batchim(hit.w)?'은':'는'} 주변에서 흔한 말이에요. 캐릭터와 색으로 개성을 살려보세요.`:'주변에서 많이 쓰는 말과 겹치지 않아 기억에 잘 남는 이름이에요.';
 return `<div class="market"><div class="market-head">우리 동네 같은 업종</div><p class="market-big">${near.length?`${esc(place)}에 <b>${esc(stores.cats[c][2])}</b> 가게 <b>${near.length.toLocaleString()}곳</b>`:`${esc(place)}에는 아직 <b>${esc(stores.cats[c][2])}</b> 가게가 없어요`}</p><ul>${state.dong?`<li>경산시 전체로는 ${same.length.toLocaleString()}곳이에요.</li>`:'<li>가게 위치를 고르면 동네 기준으로 보여드려요.</li>'}${words.length?`<li>${state.dong&&pool===near?'이 동네':'경산시'} 같은 업종 이름에 자주 쓰인 말: ${words.map(w=>`<b>${esc(w.w)}</b> ${w.n}곳`).join(' · ')}</li>`:''}<li>${tip}</li></ul>${src}</div>`}
async function init(){checkAI();loadStores();try{if(window.GAGEON_ASSETS){assets=window.GAGEON_ASSETS}else{await Promise.all(['cow','coffee','bread','shop'].map(async n=>{const r=await fetch('assets/'+n+'.svg');if(!r.ok)throw Error(n);assets[n]=await r.text()}))}render()}catch{$('#app').innerHTML='<main class="main"><h1>파일을 불러오지 못했어요.</h1><p>연결을 확인하고 새로고침해주세요.</p></main>'}}
init();
</script><script>if('serviceWorker' in navigator&&['http:','https:'].includes(location.protocol)){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()});addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}))}</script></body></html>
